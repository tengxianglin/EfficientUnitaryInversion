name: EUI explicit finite uniform-ray escape (196-column)

on:
  push:
    branches: [main]
    paths:
      - "discover_196col_uniform_ray_time_escape.py"
      - "verify_196col_uniform_ray_time_arb.py"
      - ".github/workflows/eui-196col-uniform-ray-time-escape.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-196col-uniform-ray-time-escape
  cancel-in-progress: true

jobs:
  finite-uniform-ray-196:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale 196-column finite-time outputs before any verification
        run: |
          rm -f evidence/196col_uniform_ray_time_search_n21.json
          rm -f evidence/196col_uniform_ray_time_arb_n21.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs, regression tests, and compile finite-time tools
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile discover_196col_uniform_torus_pricing.py verify_196col_uniform_torus_pricing_arb.py discover_196col_uniform_ray_time_escape.py verify_196col_uniform_ray_time_arb.py
      - name: Re-certify the 193-column parent and finite-time escape
        run: |
          python verify_193col_uniform_ray_dual_arb.py
          python verify_193col_uniform_ray_time_arb.py
      - name: Re-certify the 194-column parent and finite-time escape
        run: |
          python verify_194col_uniform_ray_dual_arb.py
          python verify_194col_uniform_ray_time_arb.py
      - name: Re-certify the 195-column parent and finite-time escape
        run: |
          python verify_195col_uniform_ray_dual_arb.py
          python verify_195col_uniform_ray_time_arb.py
      - name: Re-certify the 196-column finite-pool dual and torus escape
        run: |
          python verify_196col_uniform_ray_dual_arb.py
          python verify_196col_uniform_torus_pricing_arb.py
      - name: Search bounded ranges for an explicit finite uniform coupling
        run: |
          python discover_196col_uniform_ray_time_escape.py \
            --output evidence/196col_uniform_ray_time_search_n21.json \
            --maxiter 200 --popsize 20
      - name: Independently certify the exact positive time with Arb
        run: python verify_196col_uniform_ray_time_arb.py
      - name: Commit only artifacts generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-196time/evidence
          for f in \
            evidence/196col_uniform_ray_time_search_n21.json \
            evidence/196col_uniform_ray_time_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-196time/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/196col_uniform_ray_time_search_n21.json
            rm -f evidence/196col_uniform_ray_time_arb_n21.json
            for f in \
              evidence/196col_uniform_ray_time_search_n21.json \
              evidence/196col_uniform_ray_time_arb_n21.json; do
              if [ -f "/tmp/eui-196time/$f" ]; then
                cp "/tmp/eui-196time/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record explicit 196-column uniform-ray escape evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload finite-time search and Arb certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-196col-uniform-ray-time-escape
          path: |
            evidence/196col_uniform_ray_time_search_n21.json
            evidence/196col_uniform_ray_time_arb_n21.json
          if-no-files-found: warn
