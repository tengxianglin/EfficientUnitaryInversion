name: EUI 103-column 38-probe reweighting from eight new Arb sixth separators

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-103col-38probe-reoptimization.yml"
      - "joint_low_six_eighth_lp_with_103col_eight_more_sixth_separators.py"
      - "verify_103col_38probe_candidate_selected_and_sixth_prefix_arb.py"
      - "evidence/candidate_103col_30probe_complete_sixth_arb_n21.json"
      - "evidence/candidate_joint_input_103col_30probe_n21.json"
      - "evidence/joint_low_six_eighth_lp_103col_30probe_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Verify frozen seed pool and exact orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Add eight new strict Arb separators and solve the 1,762-row LP
        run: python joint_low_six_eighth_lp_with_103col_eight_more_sixth_separators.py
      - name: Arb-verify exact candidate and first 1,024 sixth orbits
        if: success()
        run: |
          if [ -f evidence/candidate_joint_input_103col_38probe_n21.json ]; then
            python verify_103col_38probe_candidate_selected_and_sixth_prefix_arb.py
          else
            echo "No exact candidate below 1/3 was produced; selected-row verification is not applicable."
          fi
      - name: Commit LP, exact candidate, and Arb audit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          for f in evidence/joint_low_six_eighth_lp_103col_38probe_n21.json evidence/candidate_joint_input_103col_38probe_n21.json evidence/candidate_103col_38probe_selected_and_sixth_prefix_arb_n21.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record 103-column 38-probe reweighting"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload 38-probe reweighting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-103col-38probe-reweighting
          path: |
            evidence/joint_low_six_eighth_lp_103col_38probe_n21.json
            evidence/candidate_joint_input_103col_38probe_n21.json
            evidence/candidate_103col_38probe_selected_and_sixth_prefix_arb_n21.json
          if-no-files-found: warn
