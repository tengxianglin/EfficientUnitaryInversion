name: EUI 15-separator sixth-order active-set reweight and Arb audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-fifteen-sixth-probe-reweight.yml"
      - "joint_low_six_eighth_lp_with_fifteen_sixth_probes.py"
      - "freeze_joint_candidate_with_fifteen_sixth_probes.py"
      - "verify_candidate_fifteen_probes_arb.py"
      - "verify_candidate_35_fifteen_probe_sixth_bound.py"
      - "verify_fifteen_probe_dual_certificate.py"
      - "THEORY_35COL_FIFTEEN_PROBE_SIXTH_AUDIT.md"
      - "evidence/candidate_sixth_prefix_14probe_n21.json"
      - "evidence/candidate_sixth_prefix_7row_n21.json"
      - "evidence/candidate_sixth_prefix_12row_n21.json"
      - "evidence/candidate_sixth_prefix_8probe_n21.json"
      - "evidence/seed_pool_n21_frozen.npy"
      - "evidence/seed_pool_n21_frozen.json"
      - "audit_complete_sixth_moments.py"
      - "screen_ising_sixth_moments.py"
      - "verify_ising_sixth_escape.py"
      - "verify_ising_moment_pricing.py"
      - "ising_fourth_moments.py"
      - "verify_full_low_moment_certificate.py"
      - "joint_low_six_eighth_lp.py"
      - "joint_low_six_eighth_lp_with_fourteen_sixth_probes.py"
      - "evidence/full_low_moment_certificate_input_n21.json"
      - "evidence/sixth_moment_screen_n21.json"
      - "evidence/sixth_moment_screen_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fifteen-probe-reweight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Verify frozen seed pool
        run: python freeze_seed_pool.py
      - name: Run orbit-enumeration regression tests
        run: python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Solve finite LP with fifteen Arb-certified sixth separators
        run: |
          python joint_low_six_eighth_lp_with_fifteen_sixth_probes.py \
            > evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_n21.json
      - name: Check finite LP dimensions and objective
        id: lp
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path("evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_n21.json").read_text())
          assert p["columns"] == 83
          assert p["rows"] == 1739
          assert p["row_blocks"] == {
              "low": 1461,
              "sixth_screen": 256,
              "sixth_certified_probes": 15,
              "selected_eighth": 7,
          }
          assert len(p["sixth_probe_rows"]) == 15
          print(json.dumps({
              "lp_max": p["lp_max"],
              "baseline_max": p["baseline_max"],
              "block_maxima": p["block_maxima"],
              "positive_support": len(p["lp_positive_weights"]),
              "finite_candidate_below_cap": p["finite_candidate_below_cap"],
          }, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("feasible=" + ("true" if p["finite_candidate_below_cap"] else "false") + "\n")
          PY
      - name: Arb-certify a dual lower bound for the frozen 83-column pool
        run: python verify_fifteen_probe_dual_certificate.py
      - name: Freeze exact rational candidate
        if: steps.lp.outputs.feasible == 'true'
        run: python freeze_joint_candidate_with_fifteen_sixth_probes.py
      - name: Arb-certify all low rows, 271 selected sixth rows, and seven selected eighth rows
        if: steps.lp.outputs.feasible == 'true'
        run: python verify_candidate_fifteen_probes_arb.py
      - name: Run fresh 1,024-orbit sixth-order Arb prefix
        if: steps.lp.outputs.feasible == 'true'
        id: prefix
        run: |
          python verify_candidate_35_fifteen_probe_sixth_bound.py --workers 8 --limit 1024 \
            --output evidence/candidate_sixth_prefix_15probe_n21.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path("evidence/candidate_sixth_prefix_15probe_n21.json").read_text())
          print(json.dumps({
              "status": p["status"],
              "passed": p["passed"],
              "evaluated_orbits": p["requested_orbits"],
              "evaluated_six_sets": p["evaluated_six_sets"],
              "failures": p["failures"][:1],
          }, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("passed=" + ("true" if p["passed"] else "false") + "\n")
          PY
      - name: Run complete sixth-order Arb audit if the prefix passes
        if: steps.prefix.outputs.passed == 'true'
        run: |
          python verify_candidate_35_fifteen_probe_sixth_bound.py --workers 8 \
            --output evidence/candidate_complete_sixth_bound_15probe_n21.json
      - name: Commit LP, exact candidate, and Arb evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          for file in \
            evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_n21.json \
            evidence/candidate_joint_input_with_fifteen_sixth_probes_n21.json \
            evidence/candidate_selected_moments_arb_with_fifteen_sixth_probes_n21.json \
            evidence/candidate_sixth_prefix_15probe_n21.json \
            evidence/candidate_complete_sixth_bound_15probe_n21.json \\
            evidence/fifteen_probe_dual_certificate_n21.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record 15-separator sixth-order reweight and Arb audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload finite design and Arb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-fifteen-sixth-probe-reweight-${{ github.sha }}
          path: |
            evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_n21.json
            evidence/candidate_joint_input_with_fifteen_sixth_probes_n21.json
            evidence/candidate_selected_moments_arb_with_fifteen_sixth_probes_n21.json
            evidence/candidate_sixth_prefix_15probe_n21.json
            evidence/candidate_complete_sixth_bound_15probe_n21.json
            evidence/fifteen_probe_dual_certificate_n21.json
          if-no-files-found: warn
