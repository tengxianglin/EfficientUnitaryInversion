name: EUI N42 principal-minor incidence identity
on:
  push:
    branches: [main]
    paths:
      - "verify_n42_principal_minor_incidence_identity_arb.py"
      - ".github/workflows/eui-n42-principal-minor-incidence-identity.yml"
  pull_request:
    paths:
      - "verify_n42_principal_minor_incidence_identity_arb.py"
      - ".github/workflows/eui-n42-principal-minor-incidence-identity.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n42-principal-minor-incidence-identity
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned Arb dependency
        run: python -m pip install "python-flint==0.9.0"
      - name: Check environment
        run: python -m pip check
      - name: Compile verifier
        run: python -m py_compile verify_n42_principal_minor_incidence_identity_arb.py
      - name: Run 256-bit Arb regression over all 780 incident quartics
        run: python verify_n42_principal_minor_incidence_identity_arb.py
      - name: Validate machine certificate
        run: python -m json.tool evidence/n42_principal_minor_incidence_identity_arb.json > /dev/null
      - name: Commit deterministic certificate
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n42_principal_minor_incidence_identity_arb.json
          if ! git diff --cached --quiet; then
            git commit -m "Certify universal pair-quartic incidence identity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Arb evidence
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-principal-minor-incidence-identity
          path: evidence/n42_principal_minor_incidence_identity_arb.json
          if-no-files-found: error
