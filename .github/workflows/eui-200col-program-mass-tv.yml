name: EUI 200-column program-mass TV exact-rational verification

on:
  push:
    branches: [main]
    paths:
      - "verify_200col_program_mass_tv_bound.py"
      - "evidence/55probe_200col_uniform_ray_escape_dual_certificate_n21.json"
      - "evidence/200col_program_mass_tv_bound_n21.json"
      - ".github/workflows/eui-200col-program-mass-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Compile and recompute the exact rational TV bound
        run: |
          python -m py_compile verify_200col_program_mass_tv_bound.py
          python verify_200col_program_mass_tv_bound.py
      - name: Require byte-for-byte reproducible evidence
        run: git diff --exit-code -- evidence/200col_program_mass_tv_bound_n21.json
