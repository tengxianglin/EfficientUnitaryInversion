name: EUI N10 exact positive physical cycle ensemble
on:
  push:
    branches: [main]
    paths:
      - "evidence/n10_positive_cycle_ensemble_atoms.json"
      - "THEORY_PHYSICAL_CYCLE_ENSEMBLE_N10.md"
      - "verify_n10_positive_cycle_ensemble.py"
      - ".github/workflows/eui-n10-positive-cycle-ensemble.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n10-positive-cycle-ensemble
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb dependency
        run: python -m pip install "python-flint==0.9.0"
      - name: Compile verifier
        run: python -m py_compile verify_n10_positive_cycle_ensemble.py
      - name: Verify exact-real positive ensemble and complete moment hierarchy
        run: python verify_n10_positive_cycle_ensemble.py
      - name: Commit deterministic Arb certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n10_positive_cycle_ensemble_arb.json
          if ! git diff --cached --quiet; then
            git commit -m "Certify exact N10 positive cycle ensemble"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Arb certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n10-positive-cycle-ensemble-arb
          path: evidence/n10_positive_cycle_ensemble_arb.json
          if-no-files-found: error
