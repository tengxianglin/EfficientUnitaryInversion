name: EUI Arb-audit all unused columns against the 151-column dual

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-151col-full-canonical-pool-arb.yml"
      - "verify_55probe_151col_full_canonical_pool_arb.py"
      - "evidence/55probe_151col_dual_certificate_n21.json"
      - "evidence/55probe_151col_dual_pricing_screen_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-full-canonical-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb and numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Verify frozen seed pool and exact orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Arb-certify every one of the 1,490 unused canonical columns
        run: python verify_55probe_151col_full_canonical_pool_arb.py
      - name: Commit full canonical-pool evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          if [ -f evidence/55probe_151col_full_canonical_pool_arb_n21.json ]; then
            git add evidence/55probe_151col_full_canonical_pool_arb_n21.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Arb-certify 151-column dual over full canonical pool"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload full canonical-pool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-151col-full-canonical-pool-arb
          path: evidence/55probe_151col_full_canonical_pool_arb_n21.json
          if-no-files-found: warn
