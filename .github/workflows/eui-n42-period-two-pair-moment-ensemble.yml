name: EUI N42 period-two exact pair-moment ensemble
on:
  push:
    branches: [main]
    paths:
      - "THEORY_N42_PERIOD_TWO_PAIR_MOMENT_ENSEMBLE.md"
      - "verify_n42_period_two_pair_moment_ensemble_arb.py"
      - "evidence/n42_period_two_pair_moment_atoms.json"
      - ".github/workflows/eui-n42-period-two-pair-moment-ensemble.yml"
  pull_request:
    paths:
      - "THEORY_N42_PERIOD_TWO_PAIR_MOMENT_ENSEMBLE.md"
      - "verify_n42_period_two_pair_moment_ensemble_arb.py"
      - "evidence/n42_period_two_pair_moment_atoms.json"
      - ".github/workflows/eui-n42-period-two-pair-moment-ensemble.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n42-period-two-pair-moment-ensemble
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb dependency
        run: python -m pip install "python-flint==0.9.0"
      - name: Compile verifier
        run: python -m py_compile verify_n42_period_two_pair_moment_ensemble_arb.py
      - name: Recompute exact-real weights and certify all pair moments
        run: python verify_n42_period_two_pair_moment_ensemble_arb.py
      - name: Commit deterministic Arb certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n42_period_two_pair_moment_ensemble_arb.json
          if ! git diff --cached --quiet; then
            git commit -m "Certify positive N42 period-two pair-moment ensemble"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Arb certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-period-two-pair-moment-ensemble
          path: evidence/n42_period_two_pair_moment_ensemble_arb.json
          if-no-files-found: error
