name: EUI N42 Z2 holonomy gauge reduction
on:
  push:
    branches: [main]
    paths:
      - "THEORY_N42_CYCLE_Z2_HOLONOMY_GAUGE_REDUCTION.md"
      - "verify_n42_cycle_z2_holonomy_gauge.py"
      - "evidence/n42_cycle_z2_holonomy_gauge.json"
      - ".github/workflows/eui-n42-cycle-z2-holonomy-gauge.yml"
  pull_request:
    paths:
      - "THEORY_N42_CYCLE_Z2_HOLONOMY_GAUGE_REDUCTION.md"
      - "verify_n42_cycle_z2_holonomy_gauge.py"
      - "evidence/n42_cycle_z2_holonomy_gauge.json"
      - ".github/workflows/eui-n42-cycle-z2-holonomy-gauge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eui-n42-cycle-z2-holonomy-gauge
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run exact gauge-orbit verifier
        run: |
          python -m py_compile verify_n42_cycle_z2_holonomy_gauge.py
          python verify_n42_cycle_z2_holonomy_gauge.py
          git diff --exit-code -- evidence/n42_cycle_z2_holonomy_gauge.json
      - name: Upload machine certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-cycle-z2-holonomy-gauge
          path: evidence/n42_cycle_z2_holonomy_gauge.json
          if-no-files-found: error
