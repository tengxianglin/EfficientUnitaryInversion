name: EUI targeted eighth-order Arb replay and joint pricing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-targeted-arb.yml"
      - "verify_candidate_eighth_probe_arb.py"
      - "verify_candidate_eighth_bound.py"
      - "eighth_orbit_enumeration.py"
      - "joint_low_six_eighth_lp.py"
      - "freeze_seed_pool.py"
      - "freeze_joint_candidate.py"
      - "verify_candidate_selected_moments_arb.py"
      - "evidence/candidate_joint_input_7row_n21.json"
      - "evidence/seed_pool_n21_frozen.npy"
      - "evidence/seed_pool_n21_frozen.json"
      - "audit_complete_sixth_moments.py"
      - "screen_ising_sixth_moments.py"
      - "verify_ising_moment_pricing.py"
      - "verify_ising_sixth_escape.py"
      - "verify_full_low_moment_certificate.py"
      - "ising_fourth_moments.py"
      - "ising_moment_pricing.py"
      - "ising_sixth_pricing.py"
      - "batch_ising_moment_pricing.py"
      - "continue_ising_moment_pricing.py"
      - "verify_ising_minor_obstruction.py"
      - "evidence/candidate_joint_input_n21.json"
      - "evidence/candidate_eighth_probe_arb_n21.json"
      - "evidence/joint_low_six_eighth_lp_n21.json"
      - "evidence/sixth_escape_ensemble_certificate_input_n21.json"
      - "evidence/sixth_pricing_escape_n21.json"
      - "evidence/sixth_pricing_escape_reweight_n21.json"
      - "evidence/sixth_escape_ensemble_certificate_n21.json"
      - "evidence/full_low_moment_certificate_input_n21.json"
      - "evidence/complete_sixth_certificate_input_n21.json"
      - "evidence/directed_fourth_pricing_n21.json"
      - "evidence/iterated_fourth_pricing_n21.json"
      - "evidence/batch_fourth_pricing_n21.json"
      - "evidence/local_moment_step_n21.json"
      - "evidence/linearized_moment_step_n21.json"
      - "evidence/sixth_moment_screen_n21.json"
      - "evidence/fixed_pool_tradeoff_n21.json"
      - "evidence/fixed_pool_tradeoff_certificate_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  targeted-arb-and-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        # The seed-pool fingerprint hashes exact binary64 outputs; pin NumPy.
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Freeze the exact seed pool only on a matching generator platform
        run: python freeze_seed_pool.py
      - name: Run dependency-light orbit regression tests
        run: python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Replay the named eighth-order counterexample with Arb
        run: >-
          python verify_candidate_eighth_probe_arb.py
          --precision-bits 128
          --output evidence/candidate_eighth_probe_arb_n21.json
      - name: Check the strict interval result
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          p = json.loads(Path("evidence/candidate_eighth_probe_arb_n21.json").read_text())
          assert p["strict_violation"] is True
          assert Fraction(p["certified_error_lower_bound"]) > Fraction(p["failed_cap"])
          assert Fraction(p["failed_cap"]) == Fraction(1, 3)
          assert p["precision_bits"] >= 128
          assert p["support_size"] == 29
          assert p["dihedral_orbit_size"] == 42
          assert p["principal_minor_determinant_evaluations"] == 1218
          print(json.dumps(p, indent=2))
          PY
      - name: Add the Arb-certified orbit to the finite minimax LP
        run: python joint_low_six_eighth_lp.py > evidence/joint_low_six_eighth_lp_with_probe_n21.json
      - name: Check the finite LP transcript
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("evidence/joint_low_six_eighth_lp_with_probe_n21.json").read_text())
          assert p["columns"] == 83
          assert p["row_blocks"] == {"low": 1461, "sixth_screen": 256, "selected_eighth": 7}
          assert p["rows"] == 1724
          assert p["selected_eighth_rows"][-1] == [0, 1, 3, 14, 19, 24, 29, 40]
          assert p["lp_max"] <= p["baseline_max"] + 1e-7
          print(json.dumps({
              "columns": p["columns"],
              "rows": p["rows"],
              "baseline_max": p["baseline_max"],
              "lp_max": p["lp_max"],
              "low_max": p["lp_low_max"],
              "sixth_screen_max": p["lp_sixth_screen_max"],
              "selected_eighth_max": p["lp_selected_eighth_max"],
              "positive_weights": len(p["lp_positive_weights"]),
          }, indent=2))
          PY
      - name: Freeze exact rational candidate input
        run: python freeze_joint_candidate.py
      - name: Arb-certify every low row, the sixth screen, and seven selected eighth rows
        run: python verify_candidate_selected_moments_arb.py
      - name: Check selected-moment Arb certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("evidence/candidate_selected_moments_arb_n21.json").read_text())
          blocks = p["certified_blocks"]
          assert p["support_size"] == 32 and p["precision_bits"] >= 128
          assert blocks["low_all_rows"]["rows"] == 1461
          assert blocks["sixth_screen_only"]["rows"] == 256
          assert blocks["eighth_selected_only"]["rows"] == 7
          print(json.dumps({k: v["worst_midpoint"] for k, v in blocks.items()}, indent=2))
          PY
      - name: Commit frozen LP transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json evidence/joint_low_six_eighth_lp_with_probe_n21.json evidence/candidate_joint_input_7row_n21.json evidence/candidate_selected_moments_arb_n21.json
          git commit -m "Freeze seven-row finite minimax LP transcript"
          git push
      - name: Upload the interval and LP transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-eighth-arb-and-pricing-${{ github.sha }}
          path: |
            evidence/candidate_eighth_probe_arb_n21.json
            evidence/seed_pool_n21_frozen.json
            evidence/joint_low_six_eighth_lp_with_probe_n21.json
            evidence/candidate_joint_input_7row_n21.json
            evidence/candidate_selected_moments_arb_n21.json
          if-no-files-found: warn
