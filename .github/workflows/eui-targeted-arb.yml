name: EUI targeted eighth-order Arb replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-targeted-arb.yml"
      - "verify_candidate_eighth_probe_arb.py"
      - "verify_candidate_eighth_bound.py"
      - "eighth_orbit_enumeration.py"
      - "audit_complete_sixth_moments.py"
      - "screen_ising_sixth_moments.py"
      - "verify_ising_moment_pricing.py"
      - "verify_ising_sixth_escape.py"
      - "verify_full_low_moment_certificate.py"
      - "ising_fourth_moments.py"
      - "ising_moment_pricing.py"
      - "ising_sixth_pricing.py"
      - "batch_ising_moment_pricing.py"
      - "continue_ising_moment_pricing.py"
      - "verify_ising_minor_obstruction.py"
      - "evidence/candidate_joint_input_n21.json"
      - "evidence/joint_low_six_eighth_lp_n21.json"
      - "evidence/sixth_escape_ensemble_certificate_input_n21.json"
      - "evidence/sixth_pricing_escape_n21.json"
      - "evidence/sixth_pricing_escape_reweight_n21.json"
      - "evidence/sixth_escape_ensemble_certificate_n21.json"
      - "evidence/full_low_moment_certificate_input_n21.json"
      - "evidence/directed_fourth_pricing_n21.json"
      - "evidence/iterated_fourth_pricing_n21.json"
      - "evidence/batch_fourth_pricing_n21.json"
      - "evidence/local_moment_step_n21.json"
      - "evidence/linearized_moment_step_n21.json"
      - "evidence/sixth_moment_screen_n21.json"
      - "evidence/fixed_pool_tradeoff_n21.json"
      - "evidence/fixed_pool_tradeoff_certificate_n21.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-arb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.2.6" "scipy==1.15.3"
      - name: Run dependency-light orbit regression tests
        run: python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Replay the named eighth-order counterexample with Arb
        run: >-
          python verify_candidate_eighth_probe_arb.py
          --precision-bits 128
          --output evidence/candidate_eighth_probe_arb_n21.json
      - name: Check the strict interval result
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          p = json.loads(Path("evidence/candidate_eighth_probe_arb_n21.json").read_text())
          assert p["strict_violation"] is True
          assert Fraction(p["certified_error_lower_bound"]) > Fraction(p["failed_cap"])
          assert Fraction(p["failed_cap"]) == Fraction(1, 3)
          assert p["precision_bits"] >= 128
          assert p["support_size"] == 29
          assert p["dihedral_orbit_size"] == 42
          assert p["principal_minor_determinant_evaluations"] == 1218
          print(json.dumps(p, indent=2))
          PY
      - name: Upload the interval transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-targeted-eighth-arb-${{ github.sha }}
          path: evidence/candidate_eighth_probe_arb_n21.json
          if-no-files-found: warn
