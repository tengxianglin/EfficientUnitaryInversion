name: EUI 200-column mixed-order rational dual Arb certification

on:
  push:
    branches: [main]
    paths:
      - "verify_200col_uniform_ray_dual_arb.py"
      - ".github/workflows/eui-certify-200col-uniform-ray-dual.yml"
      - "evidence/joint_low_six_eighth_lp_200col_uniform_ray_escape_n21.json"
      - "evidence/55probe_199col_uniform_ray_escape_dual_certificate_n21.json"
      - "evidence/199col_uniform_ray_time_arb_n21.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-certify-200col-uniform-ray-dual
  cancel-in-progress: false

jobs:
  certify-200:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale 200-column certificate
        run: rm -f evidence/55probe_200col_uniform_ray_escape_dual_certificate_n21.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Freeze seed pool, run regressions, and compile verifiers
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile verify_199col_uniform_ray_dual_arb.py verify_199col_uniform_ray_time_arb.py verify_200col_uniform_ray_dual_arb.py
      - name: Re-certify the 199-column parent dual and finite-time escape
        run: |
          python verify_199col_uniform_ray_dual_arb.py
          python verify_199col_uniform_ray_time_arb.py
      - name: Rationalize and independently Arb-certify all 200 dual inequalities
        run: python verify_200col_uniform_ray_dual_arb.py
      - name: Commit only the 200-column certificate generated by this run (race-safe)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/eui-200dual/evidence
          f=evidence/55probe_200col_uniform_ray_escape_dual_certificate_n21.json
          if [ -f "$f" ]; then cp "$f" /tmp/eui-200dual/evidence/; fi
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f "$f"
            if [ -f /tmp/eui-200dual/$f ]; then
              cp /tmp/eui-200dual/$f "$f"
              python - <<'PY'
          import hashlib, json
          from pathlib import Path
          c = json.loads(Path("evidence/55probe_200col_uniform_ray_escape_dual_certificate_n21.json").read_text())
          checks = {
              "lp_transcript_sha256": "evidence/joint_low_six_eighth_lp_200col_uniform_ray_escape_n21.json",
              "parent_199col_lp_sha256": "evidence/joint_low_six_eighth_lp_199col_uniform_ray_escape_n21.json",
              "parent_199col_dual_certificate_sha256": "evidence/55probe_199col_uniform_ray_escape_dual_certificate_n21.json",
              "parent_199col_uniform_ray_time_arb_certificate_sha256": "evidence/199col_uniform_ray_time_arb_n21.json",
          }
          for key, path in checks.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if c.get(key) != actual:
                  raise SystemExit(f"refusing stale 200-column provenance for {key}")
          PY
              git add "$f"
            fi
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+actions-bot@users.noreply.github.com"
              git commit -m "Record 200-column mixed-order Arb dual certificate"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 200-column rational dual certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-200col-mixed-order-dual-certificate
          path: evidence/55probe_200col_uniform_ray_escape_dual_certificate_n21.json
          if-no-files-found: warn
          retention-days: 90
