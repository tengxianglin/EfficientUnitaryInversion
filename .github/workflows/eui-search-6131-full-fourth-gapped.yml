name: EUI 6,131-column full-fourth continuous gapped pricing

on:
  push:
    branches: [main]
    paths:
      - "search_ising_full_fourth_plus_eight_gapped_n21.py"
      - "verify_ising_full_fourth_plus_eight_gapped_escape_arb_n21.py"
      - ".github/workflows/eui-search-6131-full-fourth-gapped.yml"
      - "evidence/ising_full_fourth_plus_eight_gapped_n21.json"
      - "evidence/ising_full_fourth_plus_eight_gapped_arb_n21.json"
      - "evidence/seed_pool_n21_frozen.npy"
      - "freeze_seed_pool.py"
      - "ising_fourth_moments.py"
      - "ising_moment_pricing.py"
      - "verify_ising_full_fourth_fractional_grid_dual_arb.py"
      - "verify_ising_low_moment_design.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-search-6131-full-fourth-gapped
  cancel-in-progress: false

jobs:
  pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale pricing outputs
        run: |
          rm -f evidence/ising_full_fourth_plus_eight_gapped_search_n21.json
          rm -f evidence/ising_full_fourth_plus_eight_gapped_escape_arb_n21.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned numerical and interval stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Verify frozen seed pool and compile search/verifier
        run: |
          python freeze_seed_pool.py
          python -m py_compile search_ising_full_fourth_plus_eight_gapped_n21.py verify_ising_full_fourth_plus_eight_gapped_escape_arb_n21.py
      - name: Search connected and multi-segment open paths against the exact 6,131 dual
        run: python search_ising_full_fourth_plus_eight_gapped_n21.py
      - name: Independently Arb-certify any candidate escape
        run: python verify_ising_full_fourth_plus_eight_gapped_escape_arb_n21.py
      - name: Commit only artifacts generated by this run (race-safe)
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-6131-gapped/evidence
          for f in evidence/ising_full_fourth_plus_eight_gapped_search_n21.json evidence/ising_full_fourth_plus_eight_gapped_escape_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-6131-gapped/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/ising_full_fourth_plus_eight_gapped_search_n21.json evidence/ising_full_fourth_plus_eight_gapped_escape_arb_n21.json
            for f in ising_full_fourth_plus_eight_gapped_search_n21.json ising_full_fourth_plus_eight_gapped_escape_arb_n21.json; do
              if [ -f "/tmp/eui-6131-gapped/evidence/$f" ]; then
                cp "/tmp/eui-6131-gapped/evidence/$f" evidence/
                git add "evidence/$f"
              fi
            done
            if git diff --cached --quiet; then
              echo "No 6,131-column pricing artifacts were produced."
              exit 1
            fi
            git commit -m "Record 6,131-column continuous gapped pricing"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload search and Arb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-6131-full-fourth-gapped-pricing
          path: |
            evidence/ising_full_fourth_plus_eight_gapped_search_n21.json
            evidence/ising_full_fourth_plus_eight_gapped_escape_arb_n21.json
          if-no-files-found: warn
          retention-days: 90
