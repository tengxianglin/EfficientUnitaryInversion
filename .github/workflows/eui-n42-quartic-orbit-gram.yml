name: EUI N42 aggregate quartic-orbit Gram certificate
on:
  push:
    branches: [main]
    paths:
      - "verify_n42_quartic_orbit_gram_chi_square.py"
      - "THEORY_N42_QUARTIC_ORBIT_GRAM_CHI_SQUARE.md"
      - "evidence/n42_period_two_six_quartic_all_orbits_arb.json"
      - ".github/workflows/eui-n42-quartic-orbit-gram.yml"
  pull_request:
    paths:
      - "verify_n42_quartic_orbit_gram_chi_square.py"
      - "evidence/n42_period_two_six_quartic_all_orbits_arb.json"
      - ".github/workflows/eui-n42-quartic-orbit-gram.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n42-quartic-orbit-gram
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb dependency
        run: python -m pip install "python-flint==0.9.0"
      - name: Check environment and frozen inputs
        run: |
          python -m pip check
          python -m json.tool evidence/n42_period_two_six_quartic_all_orbits_arb.json > /dev/null
          python -m py_compile verify_n42_quartic_orbit_gram_chi_square.py
      - name: Build exact 1,440 by 1,440 orbit Gram quadratic and certify chi-square bound
        run: python verify_n42_quartic_orbit_gram_chi_square.py
      - name: Commit deterministic aggregate certificate
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n42_quartic_orbit_gram_chi_square_arb.json
          if ! git diff --cached --quiet; then
            git commit -m "Certify aggregate N42 quartic Gram discrepancy"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload aggregate certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-quartic-orbit-gram-certificate
          path: evidence/n42_quartic_orbit_gram_chi_square_arb.json
          if-no-files-found: error
