name: EUI 200-column finite uniform-ray time pricing and Arb verification

on:
  push:
    branches: [main]
    paths:
      - "discover_200col_uniform_ray_time_escape.py"
      - "verify_200col_uniform_ray_time_arb.py"
      - ".github/workflows/eui-200col-uniform-ray-time.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-200col-uniform-ray-time
  cancel-in-progress: true

jobs:
  finite-time-200:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale 200-column finite-time outputs
        run: |
          rm -f evidence/200col_uniform_ray_time_search_n21.json
          rm -f evidence/200col_uniform_ray_time_arb_n21.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen 200-column inputs and compile tools
        run: |
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile discover_200col_uniform_torus_pricing.py discover_200col_uniform_ray_time_escape.py verify_200col_uniform_ray_time_arb.py verify_200col_uniform_torus_pricing_arb.py verify_200col_uniform_ray_dual_arb.py
      - name: Re-certify the 200-column dual, TV corollary, and torus escape
        run: |
          python verify_200col_uniform_ray_dual_arb.py
          python verify_200col_program_mass_tv_bound.py
          python verify_200col_uniform_torus_pricing_arb.py
      - name: Search bounded positive times on the equal-coupling physical ray
        run: python discover_200col_uniform_ray_time_escape.py --starts 6 --maxiter 200
      - name: Independently certify the exact-decimal time with Arb
        run: python verify_200col_uniform_ray_time_arb.py
      - name: Commit only evidence generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-200time/evidence
          for f in evidence/200col_uniform_ray_time_search_n21.json evidence/200col_uniform_ray_time_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-200time/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/200col_uniform_ray_time_search_n21.json evidence/200col_uniform_ray_time_arb_n21.json
            for f in evidence/200col_uniform_ray_time_search_n21.json evidence/200col_uniform_ray_time_arb_n21.json; do
              if [ -f "/tmp/eui-200time/$f" ]; then
                cp "/tmp/eui-200time/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 200-column finite uniform-ray escape evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 200-column finite-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-200col-uniform-ray-time
          path: |
            evidence/200col_uniform_ray_time_search_n21.json
            evidence/200col_uniform_ray_time_arb_n21.json
          if-no-files-found: warn
