name: EUI reoptimize after the sixth certified continuous-path escape

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_189col_sixth_continuous_escape.py"
      - ".github/workflows/eui-189col-sixth-continuous-escape.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Re-certify the 188-column parent and all six continuous-path inputs
        run: |
          python verify_continuous_path_dual_escape_arb.py
          python verify_184col_continuous_dual_escape_arb.py
          python verify_185col_continuous_dual_escape_arb.py
          python verify_186col_continuous_dual_escape_arb.py
          python verify_187col_continuous_dual_escape_arb.py
          python verify_188col_fifth_continuous_escape_dual_arb.py
          python verify_188col_continuous_dual_escape_arb.py
      - name: Compile the 189-column reoptimizer
        run: python -m py_compile reoptimize_189col_sixth_continuous_escape.py
      - name: Remove stale 189-column outputs
        run: |
          rm -f evidence/joint_low_six_eighth_lp_189col_sixth_continuous_escape_n21.json
          rm -f evidence/candidate_joint_input_189col_sixth_continuous_escape_n21.json
      - name: Reoptimize the 189-column, 2,113-row mixed-order LP
        run: python reoptimize_189col_sixth_continuous_escape.py
      - name: Commit 189-column discovery evidence with race-safe retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-189
          for f in \
            evidence/joint_low_six_eighth_lp_189col_sixth_continuous_escape_n21.json \
            evidence/candidate_joint_input_189col_sixth_continuous_escape_n21.json; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/eui-189/$(dirname "$f")"
              cp "$f" "/tmp/eui-189/$f"
            fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            for f in \
              evidence/joint_low_six_eighth_lp_189col_sixth_continuous_escape_n21.json \
              evidence/candidate_joint_input_189col_sixth_continuous_escape_n21.json; do
              if [ -f "/tmp/eui-189/$f" ]; then
                cp "/tmp/eui-189/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 189-column sixth continuous escape reoptimization"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 189-column discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-189col-sixth-continuous-escape
          path: |
            evidence/joint_low_six_eighth_lp_189col_sixth_continuous_escape_n21.json
            evidence/candidate_joint_input_189col_sixth_continuous_escape_n21.json
          if-no-files-found: warn
