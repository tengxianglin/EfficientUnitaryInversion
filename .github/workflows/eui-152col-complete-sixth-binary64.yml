name: EUI complete-sixth cutting-plane repair for the 152-column pool

on:
  push:
    branches: [main]
    paths:
      - "audit_152col_complete_sixth_binary64.py"
      - "repair_152col_full_sixth_cuts.py"
      - ".github/workflows/eui-152col-complete-sixth-binary64.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sixth-cut-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Restore and verify frozen seed pool
        run: python freeze_seed_pool.py
      - name: Exhaustively screen all sixth-order orbits and persist every violation
        run: python audit_152col_complete_sixth_binary64.py
      - name: Add all unique violating sixth rows and reoptimize the 152-column pool
        run: python repair_152col_full_sixth_cuts.py
      - name: Commit scan and cutting-plane evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          for f in evidence/candidate_152col_complete_sixth_binary64_n21.json evidence/joint_low_six_eighth_lp_152col_full_sixth_cuts_n21.json evidence/candidate_joint_input_152col_full_sixth_cuts_n21.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Add all complete-sixth violations to the 152-column minimax LP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload cutting-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-152col-full-sixth-cut-repair
          path: |
            evidence/candidate_152col_complete_sixth_binary64_n21.json
            evidence/joint_low_six_eighth_lp_152col_full_sixth_cuts_n21.json
            evidence/candidate_joint_input_152col_full_sixth_cuts_n21.json
          if-no-files-found: warn
