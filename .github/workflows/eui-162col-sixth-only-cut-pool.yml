name: EUI 162-column sixth-only cut reoptimization

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_162col_sixth_only_cut_pool.py"
      - ".github/workflows/eui-162col-sixth-only-cut-pool.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize-sixth-only:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit helpers
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Remove any stale sixth-only candidate
        run: rm -f evidence/candidate_joint_input_162col_sixth_only_n21.json
      - name: Solve the 2,106-row sixth-only minimax LP
        run: python reoptimize_162col_sixth_only_cut_pool.py
      - name: Commit sixth-only LP transcript and candidate
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/eui-162sixth
          cp evidence/joint_low_six_lp_162col_sixth_only_n21.json /tmp/eui-162sixth/lp.json
          if [ -f evidence/candidate_joint_input_162col_sixth_only_n21.json ]; then
            cp evidence/candidate_joint_input_162col_sixth_only_n21.json /tmp/eui-162sixth/candidate.json
          fi
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            cp /tmp/eui-162sixth/lp.json evidence/joint_low_six_lp_162col_sixth_only_n21.json
            if [ -f /tmp/eui-162sixth/candidate.json ]; then
              cp /tmp/eui-162sixth/candidate.json evidence/candidate_joint_input_162col_sixth_only_n21.json
            fi
            git add evidence/joint_low_six_lp_162col_sixth_only_n21.json
            if [ -f /tmp/eui-162sixth/candidate.json ]; then
              git add evidence/candidate_joint_input_162col_sixth_only_n21.json
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Record 162-column sixth-only minimax reoptimization"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
