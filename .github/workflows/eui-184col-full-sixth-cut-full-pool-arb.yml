name: EUI Arb-audit every unused canonical column against the 184-column dual

on:
  push:
    branches: [main]
    paths:
      - "verify_184col_full_sixth_cut_dual_all_canonical_arb.py"
      - ".github/workflows/eui-184col-full-sixth-cut-full-pool-arb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Re-certify the exact 184-column dual
        run: python verify_184col_full_sixth_cut_dual_arb.py
      - name: Recompute the full binary64 canonical screen
        run: python price_unused_canonical_paths_against_184col_full_sixth_cut_dual.py
      - name: Compile the complete Arb verifier
        run: python -m py_compile verify_184col_full_sixth_cut_dual_all_canonical_arb.py
      - name: Arb-audit all 1,458 unused canonical columns
        run: python verify_184col_full_sixth_cut_dual_all_canonical_arb.py
      - name: Commit full-pool interval evidence with race-safe retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-184-full-arb
          for f in \
            evidence/55probe_184col_full_sixth_cut_dual_pricing_screen_n21.json \
            evidence/55probe_184col_full_canonical_pool_arb_n21.json; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/eui-184-full-arb/$(dirname "$f")"
              cp "$f" "/tmp/eui-184-full-arb/$f"
            fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            for f in \
              evidence/55probe_184col_full_sixth_cut_dual_pricing_screen_n21.json \
              evidence/55probe_184col_full_canonical_pool_arb_n21.json; do
              if [ -f "/tmp/eui-184-full-arb/$f" ]; then
                cp "/tmp/eui-184-full-arb/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Arb-certify separation over the full canonical pool"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload full-pool Arb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-184col-full-canonical-pool-arb
          path: |
            evidence/55probe_184col_full_sixth_cut_dual_pricing_screen_n21.json
            evidence/55probe_184col_full_canonical_pool_arb_n21.json
          if-no-files-found: warn
