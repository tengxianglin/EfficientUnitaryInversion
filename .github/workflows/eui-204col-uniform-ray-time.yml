name: EUI 204-column finite-time uniform-ray pricing and Arb verification

on:
  push:
    branches: [main]
    paths:
      - "discover_204col_uniform_ray_time_escape.py"
      - "verify_204col_uniform_ray_time_arb.py"
      - ".github/workflows/eui-204col-uniform-ray-time.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-204col-uniform-ray-time
  cancel-in-progress: true

jobs:
  price-time-204:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Freeze inputs, run regressions, and compile finite-time tools
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile discover_204col_uniform_torus_pricing.py verify_204col_uniform_torus_pricing_arb.py discover_204col_uniform_ray_time_escape.py verify_204col_uniform_ray_time_arb.py verify_204col_uniform_ray_dual_arb.py verify_204col_program_mass_tv_bound.py
      - name: Re-certify the exact 204-column finite-pool dual and TV corollary
        run: |
          python verify_204col_uniform_ray_dual_arb.py
          python verify_204col_program_mass_tv_bound.py
      - name: Re-certify the exact 204-column torus point
        run: python verify_204col_uniform_torus_pricing_arb.py
      - name: Remove stale 204-column finite-time outputs
        run: |
          rm -f evidence/204col_uniform_ray_time_search_n21.json
          rm -f evidence/204col_uniform_ray_time_arb_n21.json
      - name: Search for an explicit finite positive equal-coupling time
        run: python discover_204col_uniform_ray_time_escape.py --starts 12 --maxiter 400
      - name: Independently Arb-verify the exact finite-time witness
        run: python verify_204col_uniform_ray_time_arb.py
      - name: Commit 204-column finite-time search and Arb evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-204-time/evidence
          for f in \
            evidence/204col_uniform_ray_time_search_n21.json \
            evidence/204col_uniform_ray_time_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" "/tmp/eui-204-time/$f"; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/204col_uniform_ray_time_search_n21.json evidence/204col_uniform_ray_time_arb_n21.json
            for f in \
              evidence/204col_uniform_ray_time_search_n21.json \
              evidence/204col_uniform_ray_time_arb_n21.json; do
              if [ -f "/tmp/eui-204-time/$f" ]; then
                cp "/tmp/eui-204-time/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 204-column finite-time continuous escape"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 204-column finite-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-204col-finite-time-pricing
          path: |
            evidence/204col_uniform_ray_time_search_n21.json
            evidence/204col_uniform_ray_time_arb_n21.json
          if-no-files-found: warn
