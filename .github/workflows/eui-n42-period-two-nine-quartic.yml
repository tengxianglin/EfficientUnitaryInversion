name: EUI N42 period-two nine quartic orbits
on:
  push:
    branches: [main]
    paths:
      - "evidence/n42_period_two_nine_quartic_atoms.json"
      - "discover_n42_period_two_nine_quartic_ensemble.py"
      - "verify_n42_period_two_nine_quartic_ensemble_arb.py"
      - ".github/workflows/eui-n42-period-two-nine-quartic.yml"
  pull_request:
    paths:
      - "evidence/n42_period_two_nine_quartic_atoms.json"
      - "discover_n42_period_two_nine_quartic_ensemble.py"
      - "verify_n42_period_two_nine_quartic_ensemble_arb.py"
      - ".github/workflows/eui-n42-period-two-nine-quartic.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n42-period-two-nine-quartic
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned discovery and Arb dependencies
        run: python -m pip install "numpy==2.3.5" "scipy==1.17.0" "python-flint==0.9.0"
      - name: Check pinned environment
        run: python -m pip check
      - name: Validate frozen input
        run: python -m json.tool evidence/n42_period_two_nine_quartic_atoms.json > /dev/null
      - name: Compile discovery and verifier
        run: python -m py_compile discover_n42_period_two_nine_quartic_ensemble.py verify_n42_period_two_nine_quartic_ensemble_arb.py
      - name: Reproduce floating discovery and exhaustive quartic-orbit screen
        run: python discover_n42_period_two_nine_quartic_ensemble.py
      - name: Independently certify exact-real weights, all pairs, nine quartic orbits, and next-orbit miss
        run: python verify_n42_period_two_nine_quartic_ensemble_arb.py
      - name: Commit deterministic machine certificates
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n42_period_two_nine_quartic_discovery.json evidence/n42_period_two_nine_quartic_ensemble_arb.json
          if ! git diff --cached --quiet; then
            git commit -m "Certify N42 period-two nine-quartic partial ensemble"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload discovery and Arb evidence
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-period-two-nine-quartic
          path: |
            evidence/n42_period_two_nine_quartic_discovery.json
            evidence/n42_period_two_nine_quartic_ensemble_arb.json
          if-no-files-found: error
