name: EUI n=21 reoptimize full-fourth LP with general gapped escape

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_ising_full_fourth_plus_general_gapped_n21.py"
      - ".github/workflows/eui-full-fourth-plus-general-gapped-n21.yml"
      - "discover_ising_full_fourth_fractional_grid_n21.py"
      - "ising_fourth_moments.py"
      - "verify_ising_low_moment_design.py"
      - "evidence/ising_low_moment_two_fourth_ensemble_n21.json"
      - "evidence/ising_full_fourth_fractional_grid_n21.json"
      - "evidence/ising_full_fourth_fractional_grid_dual_arb_n21.json"
      - "evidence/ising_full_fourth_general_gapped_search_n21.json"
      - "evidence/ising_full_fourth_general_gapped_escape_arb_n21.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-full-fourth-plus-general-gapped-n21
  cancel-in-progress: false

jobs:
  reoptimize-expanded-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned numerical and interval stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Compile expanded-pool reoptimizer
        run: python -m py_compile reoptimize_ising_full_fourth_plus_general_gapped_n21.py
      - name: Rebuild 6,123 columns and append the Arb-certified connected gapped path
        run: python reoptimize_ising_full_fourth_plus_general_gapped_n21.py
      - name: Commit expanded-pool LP diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ising_full_fourth_plus_general_gapped_n21.json
          if git diff --cached --quiet; then
            echo "No expanded-pool diagnostic changes."
            exit 0
          fi
          git commit -m "Record full fourth-order LP with general gapped path"
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Upload expanded-pool diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: eui-n21-full-fourth-plus-general-gapped
          path: evidence/ising_full_fourth_plus_general_gapped_n21.json
          if-no-files-found: error
