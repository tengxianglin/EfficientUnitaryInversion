name: EUI n=21 general-gapped pricing for the certified 6,125-column dual

on:
  push:
    branches: [main]
    paths:
      - "search_ising_full_fourth_plus_two_gapped_n21.py"
      - ".github/workflows/eui-full-fourth-plus-two-gapped-search-n21.yml"
      - "ising_fourth_moments.py"
      - "ising_moment_pricing.py"
      - "evidence/seed_pool_n21_frozen.npy"
      - "evidence/ising_full_fourth_plus_two_gapped_n21.json"
      - "evidence/ising_full_fourth_plus_two_gapped_arb_n21.json"
      - "evidence/ising_full_fourth_plus_general_gapped_arb_n21.json"
      - "evidence/ising_full_fourth_plus_general_gapped_escape_arb_n21.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-full-fourth-plus-two-gapped-search-n21
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Compile pricing search
        run: python -m py_compile search_ising_full_fourth_plus_two_gapped_n21.py
      - name: Search connected and multi-segment gapped paths
        run: python search_ising_full_fourth_plus_two_gapped_n21.py
      - name: Commit frozen deterministic search transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ising_full_fourth_plus_two_gapped_search_n21.json
          if git diff --cached --quiet; then
            echo "No search diagnostic changes."
            exit 0
          fi
          git commit -m "Record general-gapped pricing for certified 6,125-column dual"
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Upload deterministic pricing transcript
        uses: actions/upload-artifact@v4
        with:
          name: eui-n21-general-gapped-pricing-certified-6125-dual
          path: evidence/ising_full_fourth_plus_two_gapped_search_n21.json
          if-no-files-found: error
          retention-days: 90
