name: EUI 6,129-column full-fourth Arb certification

on:
  push:
    branches: [main]
    paths:
      - "verify_ising_full_fourth_plus_six_gapped_arb_n21.py"
      - ".github/workflows/eui-verify-6129-full-fourth-arb.yml"
      - "evidence/ising_full_fourth_plus_six_gapped_n21.json"
      - "evidence/ising_full_fourth_plus_four_gapped_n21.json"
      - "evidence/ising_full_fourth_plus_four_gapped_arb_n21.json"
      - "evidence/ising_full_fourth_plus_four_gapped_escape_arb_n21.json"
      - "evidence/ising_full_fourth_plus_four_gapped_search_n21.json"
      - "evidence/ising_low_moment_two_fourth_ensemble_n21.json"
      - "verify_ising_full_fourth_fractional_grid_dual_arb.py"
      - "verify_ising_low_moment_design.py"
      - "ising_fourth_moments.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-verify-6129-full-fourth-arb
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale certificate before verification
        run: rm -f evidence/ising_full_fourth_plus_six_gapped_arb_n21.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned interval and numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Compile independent verifier
        run: python -m py_compile verify_ising_full_fourth_plus_six_gapped_arb_n21.py
      - name: Independently certify all 6,129 columns with Arb
        run: python verify_ising_full_fourth_plus_six_gapped_arb_n21.py
      - name: Commit only this certificate (race-safe)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-6129-arb/evidence
          if [ -f evidence/ising_full_fourth_plus_six_gapped_arb_n21.json ]; then
            cp evidence/ising_full_fourth_plus_six_gapped_arb_n21.json /tmp/eui-6129-arb/evidence/
          fi
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/ising_full_fourth_plus_six_gapped_arb_n21.json
            if [ -f /tmp/eui-6129-arb/evidence/ising_full_fourth_plus_six_gapped_arb_n21.json ]; then
              cp /tmp/eui-6129-arb/evidence/ising_full_fourth_plus_six_gapped_arb_n21.json evidence/
              git add evidence/ising_full_fourth_plus_six_gapped_arb_n21.json
            fi
            if git diff --cached --quiet; then
              echo "No certificate was produced by the verifier."
              exit 1
            fi
            git commit -m "Record 6,129-column full-fourth Arb certificate"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload certificate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-6129-full-fourth-arb-certificate
          path: evidence/ising_full_fourth_plus_six_gapped_arb_n21.json
          if-no-files-found: warn
          retention-days: 90
