name: EUI N10 connected-cycle escape from block separator

on:
  push:
    paths:
      - "verify_n10_uniform_cycle_escape_arb.py"
      - "evidence/n10_uniform_cycle_escape_arb.json"
      - ".github/workflows/eui-n10-uniform-cycle-escape.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arb-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arb backend
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Recompute connected physical cycle escape
        run: python verify_n10_uniform_cycle_escape_arb.py > /tmp/n10_uniform_cycle_escape.json
      - name: Compare frozen Arb evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          generated = json.loads(Path("/tmp/n10_uniform_cycle_escape.json").read_text())
          frozen = json.loads(Path("evidence/n10_uniform_cycle_escape_arb.json").read_text())
          assert generated == frozen, "recomputed Arb escape differs from frozen evidence"
          print("N=10 connected-cycle Arb escape: PASS")
          print(generated["connected_cycle_score_interval"])
          PY
