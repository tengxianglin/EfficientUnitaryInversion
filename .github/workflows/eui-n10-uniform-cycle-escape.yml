name: EUI N10 connected-cycle escape from block separator

on:
  push:
    paths:
      - "verify_n10_uniform_cycle_escape_arb.py"
      - ".github/workflows/eui-n10-uniform-cycle-escape.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arb-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arb backend
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Certify connected physical cycle escape
        run: python verify_n10_uniform_cycle_escape_arb.py
