name: EUI full-domain sixth-order Arb audit for 103-column 30-probe candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-103col-30probe-complete-sixth.yml"
      - "verify_103col_30probe_complete_sixth_arb.py"
      - "evidence/candidate_joint_input_103col_30probe_n21.json"
      - "evidence/candidate_103col_30probe_selected_and_sixth_prefix_arb_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete_sixth:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned interval and numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Verify frozen inputs and exact orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Audit all 63,133 sixth-order orbits with 128-bit Arb
        run: |
          python verify_103col_30probe_complete_sixth_arb.py \
            --workers 8 --precision-bits 128 \
            --output evidence/candidate_103col_30probe_complete_sixth_arb_n21.json
      - name: Commit full-domain sixth-order audit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          if [ -f evidence/candidate_103col_30probe_complete_sixth_arb_n21.json ]; then
            git add evidence/candidate_103col_30probe_complete_sixth_arb_n21.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record 103-column 30-probe full sixth-order Arb audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload full-domain sixth-order audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-103col-30probe-complete-sixth-arb
          path: evidence/candidate_103col_30probe_complete_sixth_arb_n21.json
          if-no-files-found: warn
