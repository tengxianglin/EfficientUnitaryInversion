name: EUI Arb-certify the 152-column continuous-escape candidate

on:
  push:
    branches: [main]
    paths:
      - "evidence/candidate_joint_input_152col_continuous_escape_n21.json"
      - "verify_152col_continuous_escape_candidate_arb.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-selected-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb and numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Restore and verify frozen seed pool
        run: python freeze_seed_pool.py
      - name: Arb-certify all 1,779 selected rows
        run: python verify_152col_continuous_escape_candidate_arb.py
      - name: Commit strict selected-row evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          if [ -f evidence/candidate_152col_selected_rows_arb_n21.json ]; then
            git add evidence/candidate_152col_selected_rows_arb_n21.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Arb-certify the 152-column selected-row candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload strict selected-row evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-152col-selected-rows-arb
          path: evidence/candidate_152col_selected_rows_arb_n21.json
          if-no-files-found: warn
