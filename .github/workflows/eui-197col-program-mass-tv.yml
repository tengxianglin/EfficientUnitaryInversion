name: EUI exact 197-column program-mass TV corollary

on:
  push:
    branches: [main]
    paths:
      - "verify_197col_program_mass_tv_bound.py"
      - ".github/workflows/eui-197col-program-mass-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-197col-program-mass-tv
  cancel-in-progress: true

jobs:
  exact-tv-corollary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact rational TV corollary
        run: |
          python -m py_compile verify_197col_program_mass_tv_bound.py
          python verify_197col_program_mass_tv_bound.py
      - name: Commit exact TV evidence with race-safe retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-197tv/evidence
          if [ -f evidence/197col_program_mass_tv_bound_n21.json ]; then
            cp evidence/197col_program_mass_tv_bound_n21.json /tmp/eui-197tv/evidence/
          fi
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/197col_program_mass_tv_bound_n21.json
            if [ -f /tmp/eui-197tv/evidence/197col_program_mass_tv_bound_n21.json ]; then
              cp /tmp/eui-197tv/evidence/197col_program_mass_tv_bound_n21.json evidence/
              git add evidence/197col_program_mass_tv_bound_n21.json
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Record exact 197-column program-mass TV corollary"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload exact TV certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-197col-program-mass-tv
          path: evidence/197col_program_mass_tv_bound_n21.json
          if-no-files-found: warn
