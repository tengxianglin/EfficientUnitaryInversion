name: EUI 133-column 55-separator reoptimization after Arb dual pricing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-133col-55probe-reoptimization.yml"
      - "joint_low_six_eighth_lp_133col_55probe.py"
      - "evidence/joint_low_six_eighth_lp_123col_55probe_n21.json"
      - "evidence/55probe_123col_dual_certificate_n21.json"
      - "evidence/55probe_123col_dual_pricing_arb_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Verify frozen pool and exact orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Reoptimize on all 1,779 rows over 133 legal physical columns
        run: python joint_low_six_eighth_lp_133col_55probe.py
      - name: Commit finite LP and exact candidate input
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          for f in evidence/joint_low_six_eighth_lp_133col_55probe_n21.json evidence/candidate_joint_input_133col_55probe_n21.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Reoptimize 133-column pool on 55 sixth separators"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload finite LP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-133col-55probe-reoptimization
          path: |
            evidence/joint_low_six_eighth_lp_133col_55probe_n21.json
            evidence/candidate_joint_input_133col_55probe_n21.json
          if-no-files-found: warn
