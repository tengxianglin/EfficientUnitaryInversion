name: EUI N8 period-two mixture fourth-order no-go
on:
  push:
    branches: [main]
    paths:
      - "THEORY_N8_PERIOD_TWO_MIXTURE_FOURTH_ORDER_NO_GO.md"
      - "verify_n8_period_two_mixture_fourth_order_no_go.py"
      - ".github/workflows/eui-n8-period-two-mixture-fourth-order-no-go.yml"
  pull_request:
    paths:
      - "THEORY_N8_PERIOD_TWO_MIXTURE_FOURTH_ORDER_NO_GO.md"
      - "verify_n8_period_two_mixture_fourth_order_no_go.py"
      - ".github/workflows/eui-n8-period-two-mixture-fourth-order-no-go.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n8-period-two-mixture-fourth-order-no-go
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb dependency
        run: python -m pip install "python-flint==0.9.0"
      - name: Compile verifier
        run: python -m py_compile verify_n8_period_two_mixture_fourth_order_no_go.py
      - name: Verify exact Fourier-to-minor identities and inequality samples
        run: python verify_n8_period_two_mixture_fourth_order_no_go.py
      - name: Commit deterministic Arb certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n8_period_two_mixture_fourth_order_no_go.json
          if ! git diff --cached --quiet; then
            git commit -m "Certify N8 period-two mixture no-go regression"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Arb certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n8-period-two-mixture-fourth-order-no-go
          path: evidence/n8_period_two_mixture_fourth_order_no_go.json
          if-no-files-found: error
