name: EUI n=21 full-fourth finite-grid Arb separator

on:
  push:
    branches: [main]
    paths:
      - "verify_ising_full_fourth_fractional_grid_dual_arb.py"
      - "evidence/ising_full_fourth_fractional_grid_n21.json"
      - "evidence/ising_low_moment_two_fourth_ensemble_n21.json"
      - "ising_fourth_moments.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-full-fourth-fractional-grid-arb-n21
  cancel-in-progress: false

jobs:
  full-fourth-dual-arb:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned interval stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Compile independent Arb verifier
        run: python -m py_compile verify_ising_full_fourth_fractional_grid_dual_arb.py
      - name: Certify every one of the 6,123 candidate columns
        run: python verify_ising_full_fourth_fractional_grid_dual_arb.py
      - name: Commit Arb certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ising_full_fourth_fractional_grid_dual_arb_n21.json
          if git diff --cached --quiet; then
            echo "No Arb certificate changes."
            exit 0
          fi
          git commit -m "Certify full fourth-order finite-grid separator with Arb"
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Upload Arb certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n21-full-fourth-fractional-grid-arb
          path: evidence/ising_full_fourth_fractional_grid_dual_arb_n21.json
          if-no-files-found: error
