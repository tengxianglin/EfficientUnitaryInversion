name: EUI n=21 full fourth-order fractional-grid test

on:
  push:
    branches: [main]
    paths:
      - "discover_ising_full_fourth_fractional_grid_n21.py"
      - ".github/workflows/eui-full-fourth-fractional-grid-n21.yml"
      - "ising_fourth_moments.py"
      - "verify_ising_low_moment_design.py"
      - "evidence/ising_low_moment_two_fourth_ensemble_n21.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-full-fourth-fractional-grid-n21
  cancel-in-progress: false

jobs:
  full-fourth-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned numerical and interval stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Verify block-minor implementation and exact spin symmetry
        run: python discover_ising_full_fourth_fractional_grid_n21.py --self-test-only
      - name: Build full 1,440-orbit fractional-grid matrix and solve 1,314 equations
        run: python discover_ising_full_fourth_fractional_grid_n21.py
      - name: Commit the frozen finite-grid diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ising_full_fourth_fractional_grid_n21.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "Record full fourth-order fractional-grid feasibility test"
          git push
      - name: Upload full fourth-order diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: eui-n21-full-fourth-fractional-grid
          path: evidence/ising_full_fourth_fractional_grid_n21.json
          if-no-files-found: error
