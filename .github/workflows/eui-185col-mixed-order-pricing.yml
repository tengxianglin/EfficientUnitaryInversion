name: EUI price canonical paths against the 185-column mixed-order dual

on:
  push:
    branches: [main]
    paths:
      - "price_unused_canonical_paths_against_185col_mixed_order_dual.py"
      - ".github/workflows/eui-185col-mixed-order-pricing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit helpers
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Re-run the exact 185-column Arb certificate
        run: python verify_185col_mixed_order_dual_arb.py
      - name: Price all 1,457 unused canonical paths and Arb-check the leading candidates
        run: python price_unused_canonical_paths_against_185col_mixed_order_dual.py
      - name: Commit deterministic 185-column pricing evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-185pricing
          cp evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json /tmp/eui-185pricing/screen.json
          cp evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json /tmp/eui-185pricing/arb.json
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            cp /tmp/eui-185pricing/screen.json evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json
            cp /tmp/eui-185pricing/arb.json evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json
            git add evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Arb pricing against the 185-column mixed-order dual"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 185-column pricing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-185col-mixed-order-pricing
          path: |
            evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json
            evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json
          if-no-files-found: warn
