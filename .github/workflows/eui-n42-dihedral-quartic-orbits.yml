name: EUI N42 dihedral quartic orbit reduction
on:
  push:
    branches: [main]
    paths:
      - "THEORY_N42_DIHEDRAL_SYMMETRY_REDUCTION.md"
      - "verify_n42_dihedral_quartic_orbits.py"
      - "evidence/n42_dihedral_quartic_orbits.json"
      - ".github/workflows/eui-n42-dihedral-quartic-orbits.yml"
  pull_request:
    paths:
      - "THEORY_N42_DIHEDRAL_SYMMETRY_REDUCTION.md"
      - "verify_n42_dihedral_quartic_orbits.py"
      - "evidence/n42_dihedral_quartic_orbits.json"
      - ".github/workflows/eui-n42-dihedral-quartic-orbits.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eui-n42-dihedral-quartic-orbits
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run exact orbit verifier
        run: |
          python -m py_compile verify_n42_dihedral_quartic_orbits.py
          python verify_n42_dihedral_quartic_orbits.py
          git diff --exit-code -- evidence/n42_dihedral_quartic_orbits.json
      - name: Upload machine certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-dihedral-quartic-orbits
          path: evidence/n42_dihedral_quartic_orbits.json
          if-no-files-found: error
