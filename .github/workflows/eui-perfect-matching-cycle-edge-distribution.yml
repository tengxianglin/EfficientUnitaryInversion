name: EUI perfect-matching cycle-edge distribution
on:
  push:
    paths:
      - "THEORY_PERFECT_MATCHING_CYCLE_EDGE_DISTRIBUTION_N42.md"
      - "verify_perfect_matching_cycle_edge_distribution.py"
      - "evidence/perfect_matching_cycle_edge_distribution_n42.json"
      - ".github/workflows/eui-perfect-matching-cycle-edge-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve committed evidence
        run: git show HEAD:evidence/perfect_matching_cycle_edge_distribution_n42.json > /tmp/frozen-evidence.json
      - name: Compile verifier
        run: python -m py_compile verify_perfect_matching_cycle_edge_distribution.py
      - name: Recompute exact distribution and small-N brute-force checks
        run: python verify_perfect_matching_cycle_edge_distribution.py
      - name: Compare frozen and recomputed evidence semantically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          frozen = json.loads(Path("/tmp/frozen-evidence.json").read_text())
          recomputed = json.loads(Path("evidence/perfect_matching_cycle_edge_distribution_n42.json").read_text())
          if frozen != recomputed:
              raise SystemExit("frozen evidence differs from recomputed JSON object")
          print("frozen evidence matches recomputed JSON object")
          PY
