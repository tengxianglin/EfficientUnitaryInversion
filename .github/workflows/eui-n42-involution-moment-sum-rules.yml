name: EUI N42 involution moment sum rules
on:
  push:
    branches: [main]
    paths:
      - "THEORY_N42_INVOLUTION_MOMENT_SUM_RULES.md"
      - "verify_n42_involution_moment_sum_rules.py"
      - "evidence/n42_involution_moment_sum_rules.json"
      - ".github/workflows/eui-n42-involution-moment-sum-rules.yml"
  pull_request:
    paths:
      - "THEORY_N42_INVOLUTION_MOMENT_SUM_RULES.md"
      - "verify_n42_involution_moment_sum_rules.py"
      - "evidence/n42_involution_moment_sum_rules.json"
      - ".github/workflows/eui-n42-involution-moment-sum-rules.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n42-involution-moment-sum-rules
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run exact combinatorial verifier
        run: |
          python -m py_compile verify_n42_involution_moment_sum_rules.py
          python verify_n42_involution_moment_sum_rules.py
      - name: Commit deterministic certificate
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n42_involution_moment_sum_rules.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact involution moment sum-rule certificate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload machine certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-involution-moment-sum-rules
          path: evidence/n42_involution_moment_sum_rules.json
          if-no-files-found: error
