name: EUI Arb-certify a continuous positive-path escape from the 151-column dual

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-continuous-path-dual-escape-arb.yml"
      - "verify_continuous_path_dual_escape_arb.py"
      - "evidence/55probe_151col_dual_certificate_n21.json"
      - "evidence/joint_low_six_eighth_lp_151col_55probe_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-continuous-path-escape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb and numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Restore and verify frozen seed pool
        run: python freeze_seed_pool.py
      - name: Arb-certify the exact rational continuous-family escape
        run: python verify_continuous_path_dual_escape_arb.py
      - name: Commit exact Arb evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          if [ -f evidence/continuous_path_dual_escape_arb_n21.json ]; then
            git add evidence/continuous_path_dual_escape_arb_n21.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Arb-certify a continuous path escape from the finite-pool dual"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload exact Arb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-continuous-path-dual-escape-arb
          path: evidence/continuous_path_dual_escape_arb_n21.json
          if-no-files-found: warn
