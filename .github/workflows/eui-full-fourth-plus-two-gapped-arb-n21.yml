name: EUI n=21 Arb certificate for 6,125-column full-fourth separator

on:
  push:
    branches: [main]
    paths:
      - "verify_ising_full_fourth_plus_two_gapped_arb_n21.py"
      - ".github/workflows/eui-full-fourth-plus-two-gapped-arb-n21.yml"
      - "verify_ising_full_fourth_plus_general_gapped_arb_n21.py"
      - "verify_ising_full_fourth_fractional_grid_dual_arb.py"
      - "verify_ising_low_moment_design.py"
      - "ising_fourth_moments.py"
      - "evidence/ising_full_fourth_plus_two_gapped_n21.json"
      - "evidence/ising_full_fourth_plus_general_gapped_n21.json"
      - "evidence/ising_full_fourth_plus_general_gapped_arb_n21.json"
      - "evidence/ising_full_fourth_plus_general_gapped_escape_arb_n21.json"
      - "evidence/ising_low_moment_two_fourth_ensemble_n21.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-full-fourth-plus-two-gapped-arb-n21
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned interval/numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Compile independent verifier and dependencies
        run: |
          python -m py_compile verify_ising_full_fourth_plus_two_gapped_arb_n21.py
          python -m py_compile verify_ising_full_fourth_plus_general_gapped_arb_n21.py
          python -m py_compile verify_ising_full_fourth_fractional_grid_dual_arb.py
      - name: Independently Arb-certify all 6,125 columns
        run: python verify_ising_full_fourth_plus_two_gapped_arb_n21.py
      - name: Commit frozen 6,125-column Arb certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ising_full_fourth_plus_two_gapped_arb_n21.json
          if git diff --cached --quiet; then
            echo "No 6,125-column Arb certificate changes."
            exit 0
          fi
          git commit -m "Certify 6,125-column full-fourth separator with Arb"
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Upload reproducibility certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n21-full-fourth-6125-column-arb-certificate
          path: evidence/ising_full_fourth_plus_two_gapped_arb_n21.json
          if-no-files-found: error
          retention-days: 90
