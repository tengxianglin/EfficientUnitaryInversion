name: EUI N42 complete quartic-orbit audit of period-two candidate
on:
  push:
    branches: [main]
    paths:
      - "verify_n42_period_two_six_quartic_all_orbits_arb.py"
      - "verify_n42_period_two_six_quartic_ensemble_arb.py"
      - "evidence/n42_period_two_six_quartic_atoms.json"
      - ".github/workflows/eui-n42-period-two-six-quartic-all-orbits.yml"
  pull_request:
    paths:
      - "verify_n42_period_two_six_quartic_all_orbits_arb.py"
      - "verify_n42_period_two_six_quartic_ensemble_arb.py"
      - "evidence/n42_period_two_six_quartic_atoms.json"
      - ".github/workflows/eui-n42-period-two-six-quartic-all-orbits.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eui-n42-period-two-six-quartic-all-orbits
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Arb dependency
        run: python -m pip install "python-flint==0.9.0"
      - name: Check environment
        run: python -m pip check
      - name: Validate frozen inputs
        run: |
          python -m json.tool evidence/n42_period_two_six_quartic_atoms.json > /dev/null
          python -m py_compile verify_n42_period_two_six_quartic_ensemble_arb.py verify_n42_period_two_six_quartic_all_orbits_arb.py
      - name: Reconstruct exact-real weights and audit all 1,440 quartic orbits
        run: python verify_n42_period_two_six_quartic_all_orbits_arb.py
      - name: Commit deterministic all-orbit certificate
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add evidence/n42_period_two_six_quartic_all_orbits_arb.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact all-orbit N42 quartic counterexample"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload all-orbit certificate
        uses: actions/upload-artifact@v4
        with:
          name: eui-n42-period-two-six-quartic-all-orbits
          path: evidence/n42_period_two_six_quartic_all_orbits_arb.json
          if-no-files-found: error
