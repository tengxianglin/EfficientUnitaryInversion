name: EUI price canonical paths against the 182-column full-sixth-cut dual

on:
  push:
    branches: [main]
    paths:
      - "price_unused_canonical_paths_against_182col_full_sixth_cut_dual.py"
      - "verify_182col_full_sixth_cut_dual_pricing_arb.py"
      - ".github/workflows/eui-182col-full-sixth-cut-pricing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Re-certify the exact 182-column full-sixth-cut dual
        run: python verify_182col_full_sixth_cut_dual_arb.py
      - name: Compile pricing and Arb verification programs
        run: python -m py_compile price_unused_canonical_paths_against_182col_full_sixth_cut_dual.py verify_182col_full_sixth_cut_dual_pricing_arb.py
      - name: Remove stale pricing outputs
        run: |
          rm -f evidence/55probe_182col_full_sixth_cut_dual_pricing_screen_n21.json
          rm -f evidence/55probe_182col_full_sixth_cut_dual_pricing_arb_n21.json
      - name: Screen every unused canonical generator
        run: python price_unused_canonical_paths_against_182col_full_sixth_cut_dual.py
      - name: Independently Arb-check the ten leading positive candidates
        run: python verify_182col_full_sixth_cut_dual_pricing_arb.py
      - name: Commit 182-column pricing evidence with race-safe retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-182-pricing
          for f in \
            evidence/55probe_182col_full_sixth_cut_dual_pricing_screen_n21.json \
            evidence/55probe_182col_full_sixth_cut_dual_pricing_arb_n21.json; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/eui-182-pricing/$(dirname "$f")"
              cp "$f" "/tmp/eui-182-pricing/$f"
            fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            for f in \
              evidence/55probe_182col_full_sixth_cut_dual_pricing_screen_n21.json \
              evidence/55probe_182col_full_sixth_cut_dual_pricing_arb_n21.json; do
              if [ -f "/tmp/eui-182-pricing/$f" ]; then
                cp "/tmp/eui-182-pricing/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record pricing against the 182-column full-sixth-cut dual"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 182-column pricing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-182col-full-sixth-cut-pricing
          path: |
            evidence/55probe_182col_full_sixth_cut_dual_pricing_screen_n21.json
            evidence/55probe_182col_full_sixth_cut_dual_pricing_arb_n21.json
          if-no-files-found: warn
