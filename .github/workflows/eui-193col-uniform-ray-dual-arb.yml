name: EUI 193-column uniform-ray dual Arb certification

on:
  push:
    branches: [main]
    paths:
      - "verify_193col_uniform_ray_dual_arb.py"
      - ".github/workflows/eui-193col-uniform-ray-dual-arb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-193col-dual:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs and compile exact verifier
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile verify_193col_uniform_ray_dual_arb.py
      - name: Re-certify the 192-column parent dual and ancestry
        run: python verify_192col_ninth_continuous_escape_dual_arb.py
      - name: Re-certify the explicit finite uniform-ray path
        run: python verify_192col_uniform_ray_time_arb.py
      - name: Remove stale 193-column certificate
        run: rm -f evidence/55probe_193col_uniform_ray_escape_dual_certificate_n21.json
      - name: Independently certify all 193 columns with 128-bit Arb
        run: python verify_193col_uniform_ray_dual_arb.py
      - name: Commit only the certificate generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-193dual/evidence
          f=evidence/55probe_193col_uniform_ray_escape_dual_certificate_n21.json
          if [ -f "$f" ]; then cp "$f" /tmp/eui-193dual/evidence/; fi
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f "$f"
            if [ -f "/tmp/eui-193dual/$f" ]; then
              cp "/tmp/eui-193dual/$f" "$f"
              git add "$f"
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Record 193-column uniform-ray dual Arb certificate"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 193-column Arb certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-193col-uniform-ray-dual-arb
          path: evidence/55probe_193col_uniform_ray_escape_dual_certificate_n21.json
          if-no-files-found: warn
