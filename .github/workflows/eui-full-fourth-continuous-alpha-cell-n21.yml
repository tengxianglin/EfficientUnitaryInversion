name: EUI n=21 continuous-alpha interval cell probe

on:
  push:
    branches: [main]
    paths:
      - "probe_ising_full_fourth_continuous_alpha_cell_n21.py"
      - "verify_ising_full_fourth_fractional_grid_dual_arb.py"
      - "evidence/ising_full_fourth_fractional_grid_n21.json"
      - "evidence/ising_low_moment_two_fourth_ensemble_n21.json"
      - "ising_fourth_moments.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-full-fourth-continuous-alpha-cell-n21
  cancel-in-progress: false

jobs:
  interval-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned interval stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Compile interval probe
        run: python -m py_compile probe_ising_full_fourth_continuous_alpha_cell_n21.py
      - name: Enclose the full L=40 alpha cell
        run: python probe_ising_full_fourth_continuous_alpha_cell_n21.py
      - name: Commit interval evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ising_full_fourth_continuous_alpha_cell_probe_n21.json
          if git diff --cached --quiet; then
            echo "No interval evidence changes."
            exit 0
          fi
          git commit -m "Record continuous alpha interval-cell probe"
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Upload interval evidence
        uses: actions/upload-artifact@v4
        with:
          name: eui-n21-continuous-alpha-cell-probe
          path: evidence/ising_full_fourth_continuous_alpha_cell_probe_n21.json
          if-no-files-found: error
