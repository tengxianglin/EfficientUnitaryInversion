name: EUI reoptimize with Arb-certified continuous path escape

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-152col-continuous-escape-reoptimization.yml"
      - "reoptimize_152col_continuous_escape.py"
      - "evidence/continuous_path_dual_escape_arb_n21.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Restore and verify frozen seed pool
        run: python freeze_seed_pool.py
      - name: Reoptimize the 152-column expanded physical pool
        run: python reoptimize_152col_continuous_escape.py
      - name: Commit LP transcript
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          if [ -f evidence/joint_low_six_eighth_lp_152col_continuous_escape_n21.json ]; then
            git add evidence/joint_low_six_eighth_lp_152col_continuous_escape_n21.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Reoptimize the 151-column pool with a continuous-path escape"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload LP transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-152col-continuous-escape-reoptimization
          path: evidence/joint_low_six_eighth_lp_152col_continuous_escape_n21.json
          if-no-files-found: warn
