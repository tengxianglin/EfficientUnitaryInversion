name: EUI reoptimize and certify the 172-column full-sixth cut pool

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_172col_full_sixth_cut_pool.py"
      - "verify_172col_full_sixth_cut_dual_arb.py"
      - ".github/workflows/eui-172col-full-sixth-cut-pool.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Re-certify the exact 162-column parent dual
        run: python verify_162col_full_sixth_cut_dual_arb.py
      - name: Re-price the full canonical pool and strictly verify parent escapes
        run: |
          python price_unused_canonical_paths_against_162col_dual.py
          python verify_162col_full_sixth_cut_dual_pricing_arb.py
      - name: Remove stale 172-column outputs
        run: |
          rm -f evidence/joint_low_six_eighth_lp_172col_full_sixth_cuts_n21.json
          rm -f evidence/candidate_joint_input_172col_full_sixth_cuts_n21.json
          rm -f evidence/55probe_172col_full_sixth_cut_dual_certificate_n21.json
      - name: Reoptimize the 172-column, 2,113-row full-sixth cut LP
        run: python reoptimize_172col_full_sixth_cut_pool.py
      - name: Arb-certify the 172-column dual when the LP remains above one third
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          path = "evidence/joint_low_six_eighth_lp_172col_full_sixth_cuts_n21.json"
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)
          if result["finite_candidate_below_one_third"]:
              print("Sub-1/3 discovery candidate found; dual certification is not applicable.")
          else:
              subprocess.run([sys.executable, "verify_172col_full_sixth_cut_dual_arb.py"], check=True)
          PY
      - name: Commit all completed 172-column evidence with race-safe retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-172
          for f in \
            evidence/55probe_162col_full_sixth_cut_dual_pricing_screen_n21.json \
            evidence/55probe_162col_full_sixth_cut_dual_pricing_arb_n21.json \
            evidence/joint_low_six_eighth_lp_172col_full_sixth_cuts_n21.json \
            evidence/candidate_joint_input_172col_full_sixth_cuts_n21.json \
            evidence/55probe_172col_full_sixth_cut_dual_certificate_n21.json; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/eui-172/$(dirname "$f")"
              cp "$f" "/tmp/eui-172/$f"
            fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            for f in \
              evidence/55probe_162col_full_sixth_cut_dual_pricing_screen_n21.json \
              evidence/55probe_162col_full_sixth_cut_dual_pricing_arb_n21.json \
              evidence/joint_low_six_eighth_lp_172col_full_sixth_cuts_n21.json \
              evidence/candidate_joint_input_172col_full_sixth_cuts_n21.json \
              evidence/55probe_172col_full_sixth_cut_dual_certificate_n21.json; do
              if [ -f "/tmp/eui-172/$f" ]; then
                cp "/tmp/eui-172/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 172-column full-sixth cut reoptimization evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 172-column discovery and certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-172col-full-sixth-cut-pool
          path: |
            evidence/55probe_162col_full_sixth_cut_dual_pricing_screen_n21.json
            evidence/55probe_162col_full_sixth_cut_dual_pricing_arb_n21.json
            evidence/joint_low_six_eighth_lp_172col_full_sixth_cuts_n21.json
            evidence/candidate_joint_input_172col_full_sixth_cuts_n21.json
            evidence/55probe_172col_full_sixth_cut_dual_certificate_n21.json
          if-no-files-found: warn
