name: EUI reoptimize after explicit uniform-ray escape

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_193col_uniform_ray_escape.py"
      - ".github/workflows/eui-reoptimize-193col-uniform-ray.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize-193col:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs and compile 193-column reoptimizer
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile reoptimize_193col_uniform_ray_escape.py
      - name: Re-certify the 192-column parent dual and ancestry
        run: python verify_192col_ninth_continuous_escape_dual_arb.py
      - name: Re-certify the explicit finite uniform-ray path
        run: python verify_192col_uniform_ray_time_arb.py
      - name: Remove stale 193-column outputs
        run: |
          rm -f evidence/joint_low_six_eighth_lp_193col_uniform_ray_escape_n21.json
          rm -f evidence/candidate_joint_input_193col_uniform_ray_escape_n21.json
      - name: Build and solve the 193-column mixed-order LP
        run: python reoptimize_193col_uniform_ray_escape.py
      - name: Commit only artifacts generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-193col/evidence
          for f in \
            evidence/joint_low_six_eighth_lp_193col_uniform_ray_escape_n21.json \
            evidence/candidate_joint_input_193col_uniform_ray_escape_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-193col/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/joint_low_six_eighth_lp_193col_uniform_ray_escape_n21.json
            rm -f evidence/candidate_joint_input_193col_uniform_ray_escape_n21.json
            for f in \
              evidence/joint_low_six_eighth_lp_193col_uniform_ray_escape_n21.json \
              evidence/candidate_joint_input_193col_uniform_ray_escape_n21.json; do
              if [ -f "/tmp/eui-193col/$f" ]; then
                cp "/tmp/eui-193col/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 193-column uniform-ray reoptimization"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 193-column LP and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-193col-uniform-ray-reoptimization
          path: |
            evidence/joint_low_six_eighth_lp_193col_uniform_ray_escape_n21.json
            evidence/candidate_joint_input_193col_uniform_ray_escape_n21.json
          if-no-files-found: warn
