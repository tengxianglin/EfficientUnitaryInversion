name: EUI 93-column dual-priced expansion and Arb audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eui-expanded-pool-fifteen-probe.yml"
      - "joint_low_six_eighth_lp_with_fifteen_sixth_probes.py"
      - "joint_low_six_eighth_lp_with_fifteen_sixth_probes_expanded.py"
      - "freeze_expanded_candidate_with_fifteen_sixth_probes.py"
      - "verify_expanded_candidate_fifteen_probes_arb.py"
      - "verify_expanded_candidate_35_fifteen_probe_sixth_bound.py"
      - "verify_fifteen_probe_dual_certificate.py"
      - "price_unused_columns_against_fifteen_probe_dual.py"
      - "verify_unused_columns_dual_pricing_arb.py"
      - "THEORY_EXPANDED_POOL_DUAL_PRICING.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expanded-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Verify frozen seed pool
        run: python freeze_seed_pool.py
      - name: Run orbit-enumeration regression tests
        run: python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Rebuild the pinned 83-column finite LP
        run: |
          python joint_low_six_eighth_lp_with_fifteen_sixth_probes.py \
            > evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_n21.json
      - name: Certify the 83-column dual and price unused columns
        run: |
          python verify_fifteen_probe_dual_certificate.py
          python price_unused_columns_against_fifteen_probe_dual.py
          python verify_unused_columns_dual_pricing_arb.py
      - name: Solve the expanded 93-column finite LP
        id: expanded
        run: |
          python joint_low_six_eighth_lp_with_fifteen_sixth_probes_expanded.py \
            > evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_expanded_n21.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path("evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_expanded_n21.json").read_text())
          assert p["columns"] == 93 and p["rows"] == 1739
          assert len(p["added_priced_columns"]) == 10
          assert p["row_blocks"] == {
              "low": 1461, "sixth_screen": 256,
              "sixth_certified_probes": 15, "selected_eighth": 7,
          }
          print(json.dumps({
              "lp_objective": p["lp_max"],
              "baseline_max": p["baseline_max"],
              "block_maxima": p["block_maxima"],
              "positive_support": len(p["lp_positive_weights"]),
              "finite_candidate_below_one_third": p["finite_candidate_below_cap"],
              "added_priced_columns": p["added_priced_columns"],
          }, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("feasible=" + ("true" if p["finite_candidate_below_cap"] else "false") + "\n")
          PY
      - name: Freeze exact rational expanded candidate
        if: steps.expanded.outputs.feasible == 'true'
        run: python freeze_expanded_candidate_with_fifteen_sixth_probes.py
      - name: Arb-certify all selected low, sixth, and eighth rows
        if: steps.expanded.outputs.feasible == 'true'
        run: python verify_expanded_candidate_fifteen_probes_arb.py
      - name: Run fresh 1,024-orbit sixth-order Arb prefix
        if: steps.expanded.outputs.feasible == 'true'
        id: prefix
        run: |
          python verify_expanded_candidate_35_fifteen_probe_sixth_bound.py \
            --workers 8 --limit 1024 \
            --output evidence/candidate_sixth_prefix_15probe_expanded_n21.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path("evidence/candidate_sixth_prefix_15probe_expanded_n21.json").read_text())
          print(json.dumps({
              "status": p["status"], "passed": p["passed"],
              "evaluated_orbits": p["requested_orbits"],
              "evaluated_six_sets": p["evaluated_six_sets"],
              "failures": p["failures"][:1],
          }, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("passed=" + ("true" if p["passed"] else "false") + "\n")
          PY
      - name: Run complete sixth-order Arb audit if the prefix passes
        if: steps.prefix.outputs.passed == 'true'
        run: |
          python verify_expanded_candidate_35_fifteen_probe_sixth_bound.py \
            --workers 8 \
            --output evidence/candidate_complete_sixth_bound_15probe_expanded_n21.json
      - name: Commit expanded design and all available evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- evidence/seed_pool_n21_frozen.npy evidence/seed_pool_n21_frozen.json
          for file in \
            evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_n21.json \
            evidence/fifteen_probe_dual_certificate_n21.json \
            evidence/fifteen_probe_dual_pricing_screen_n21.json \
            evidence/fifteen_probe_dual_pricing_arb_n21.json \
            evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_expanded_n21.json \
            evidence/candidate_joint_input_with_fifteen_sixth_probes_expanded_n21.json \
            evidence/candidate_selected_moments_arb_with_fifteen_sixth_probes_expanded_n21.json \
            evidence/candidate_sixth_prefix_15probe_expanded_n21.json \
            evidence/candidate_complete_sixth_bound_15probe_expanded_n21.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record dual-priced 93-column EUI expansion"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload expanded LP and Arb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-expanded-pool-${{ github.sha }}
          path: |
            evidence/joint_low_six_eighth_lp_with_fifteen_sixth_probes_expanded_n21.json
            evidence/candidate_joint_input_with_fifteen_sixth_probes_expanded_n21.json
            evidence/candidate_selected_moments_arb_with_fifteen_sixth_probes_expanded_n21.json
            evidence/candidate_sixth_prefix_15probe_expanded_n21.json
            evidence/candidate_complete_sixth_bound_15probe_expanded_n21.json
            evidence/fifteen_probe_dual_pricing_arb_n21.json
          if-no-files-found: warn
