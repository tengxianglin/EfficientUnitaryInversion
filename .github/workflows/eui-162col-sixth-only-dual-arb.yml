name: EUI Arb-certify 162-column sixth-only minimax obstruction

on:
  push:
    branches: [main]
    paths:
      - "verify_162col_sixth_only_dual_arb.py"
      - ".github/workflows/eui-162col-sixth-only-dual-arb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-sixth-only:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned interval and numerical stack
        run: python -m pip install "python-flint==0.8.0" "numpy==2.3.5" "scipy==1.15.3"
      - name: Verify frozen seed pool and orbit helpers
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Reconstruct sixth-only rational dual and certify all 162 columns
        run: python verify_162col_sixth_only_dual_arb.py
      - name: Commit strict sixth-only Arb certificate
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/eui-162sixth-cert
          cp evidence/55probe_162col_sixth_only_dual_certificate_n21.json /tmp/eui-162sixth-cert/certificate.json
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            cp /tmp/eui-162sixth-cert/certificate.json evidence/55probe_162col_sixth_only_dual_certificate_n21.json
            git add evidence/55probe_162col_sixth_only_dual_certificate_n21.json
            if ! git diff --cached --quiet; then
              git commit -m "Arb-certify the 162-column sixth-only minimax obstruction"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
