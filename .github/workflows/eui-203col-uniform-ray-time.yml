name: EUI 203-column finite uniform-ray time pricing and Arb verification

on:
  push:
    branches: [main]
    paths:
      - "evidence/203col_uniform_torus_arb_n21.json"
      - "discover_203col_uniform_ray_time_escape.py"
      - "verify_203col_uniform_ray_time_arb.py"
      - ".github/workflows/eui-203col-uniform-ray-time.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-203col-uniform-ray-time
  cancel-in-progress: true

jobs:
  finite-time-203:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Freeze deterministic inputs, run regressions, and compile tools
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile discover_203col_uniform_torus_pricing.py verify_203col_uniform_torus_pricing_arb.py discover_203col_uniform_ray_time_escape.py verify_203col_uniform_ray_time_arb.py verify_203col_uniform_ray_dual_arb.py verify_203col_program_mass_tv_bound.py
      - name: Re-certify the 203-column finite-pool dual and positive torus point
        run: |
          python verify_203col_uniform_ray_dual_arb.py
          python verify_203col_uniform_torus_pricing_arb.py
      - name: Search bounded positive times only after a strict torus certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          p = Path("evidence/203col_uniform_torus_arb_n21.json")
          x = json.loads(p.read_text())
          if x.get("strict_uniform_ray_escape_certified") is True and x.get("status") == "certified_positive_uniform_torus_escape":
              subprocess.run(["python", "discover_203col_uniform_ray_time_escape.py", "--starts", "12", "--maxiter", "400"], check=True)
          else:
              print("No strictly positive torus witness; finite-time search is not justified by this run.")
          PY
      - name: Independently certify the exact finite-time candidate when found
        run: |
          if [ -f evidence/203col_uniform_ray_time_search_n21.json ]; then
            python verify_203col_uniform_ray_time_arb.py
          else
            echo "No finite-time candidate was generated."
          fi
      - name: Commit only evidence generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-203time/evidence
          for f in evidence/203col_uniform_ray_time_search_n21.json evidence/203col_uniform_ray_time_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-203time/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            for f in evidence/203col_uniform_ray_time_search_n21.json evidence/203col_uniform_ray_time_arb_n21.json; do
              if [ -f "/tmp/eui-203time/$f" ]; then
                cp "/tmp/eui-203time/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 203-column finite uniform-ray escape evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 203-column finite-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-203col-uniform-ray-time
          path: |
            evidence/203col_uniform_ray_time_search_n21.json
            evidence/203col_uniform_ray_time_arb_n21.json
          if-no-files-found: warn
