name: EUI 194-column uniform-ray torus pricing

on:
  push:
    branches: [main]
    paths:
      - "discover_194col_uniform_torus_pricing.py"
      - "verify_194col_uniform_torus_pricing_arb.py"
      - ".github/workflows/eui-194col-uniform-torus-pricing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  torus-pricing-194:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs and compile torus tools
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile discover_194col_uniform_torus_pricing.py verify_194col_uniform_torus_pricing_arb.py
      - name: Re-certify the 193-column parent dual and explicit time
        run: |
          python verify_193col_uniform_ray_dual_arb.py
          python verify_193col_uniform_ray_time_arb.py
      - name: Re-certify the 194-column dual
        run: python verify_194col_uniform_ray_dual_arb.py
      - name: Remove stale 194-column torus outputs
        run: |
          rm -f evidence/194col_uniform_torus_search_n21.json
          rm -f evidence/194col_uniform_torus_arb_n21.json
      - name: Search the 21-dimensional uniform-path torus
        run: |
          python discover_194col_uniform_torus_pricing.py \
            --output evidence/194col_uniform_torus_search_n21.json \
            --maxiter 120 --starts 12
      - name: Independently certify any exact-decimal torus candidate with Arb
        run: python verify_194col_uniform_torus_pricing_arb.py
      - name: Commit only artifacts generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-194torus/evidence
          for f in \
            evidence/194col_uniform_torus_search_n21.json \
            evidence/194col_uniform_torus_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-194torus/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/194col_uniform_torus_search_n21.json
            rm -f evidence/194col_uniform_torus_arb_n21.json
            for f in \
              evidence/194col_uniform_torus_search_n21.json \
              evidence/194col_uniform_torus_arb_n21.json; do
              if [ -f "/tmp/eui-194torus/$f" ]; then
                cp "/tmp/eui-194torus/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 194-column uniform-torus pricing evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 194-column torus search and Arb certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-194col-uniform-torus-pricing
          path: |
            evidence/194col_uniform_torus_search_n21.json
            evidence/194col_uniform_torus_arb_n21.json
          if-no-files-found: warn
