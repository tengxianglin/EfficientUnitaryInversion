name: EUI 199-column finite uniform-ray time pricing

on:
  push:
    branches: [main]
    paths:
      - "discover_199col_uniform_ray_time_escape.py"
      - "verify_199col_uniform_ray_time_arb.py"
      - ".github/workflows/eui-199col-uniform-ray-time.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-199col-uniform-ray-time
  cancel-in-progress: true

jobs:
  finite-time-pricing-199:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale 199-column finite-time outputs
        run: |
          rm -f evidence/199col_uniform_ray_time_search_n21.json
          rm -f evidence/199col_uniform_ray_time_arb_n21.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs and compile finite-time tools
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile discover_199col_uniform_torus_pricing.py verify_199col_uniform_torus_pricing_arb.py discover_199col_uniform_ray_time_escape.py verify_199col_uniform_ray_time_arb.py verify_199col_uniform_ray_dual_arb.py verify_192col_uniform_ray_time_arb.py
      - name: Re-certify the exact 199-column dual and positive torus point
        run: |
          python verify_199col_uniform_ray_dual_arb.py
          python verify_199col_uniform_torus_pricing_arb.py
      - name: Search bounded time intervals on the positive equal-coupling ray
        run: |
          python discover_199col_uniform_ray_time_escape.py \
            --output evidence/199col_uniform_ray_time_search_n21.json \
            --maxiter 200 --popsize 20
      - name: Independently certify any exact-decimal finite time with Arb
        run: python verify_199col_uniform_ray_time_arb.py
      - name: Commit only artifacts generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-199time/evidence
          for f in \
            evidence/199col_uniform_ray_time_search_n21.json \
            evidence/199col_uniform_ray_time_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-199time/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/199col_uniform_ray_time_search_n21.json
            rm -f evidence/199col_uniform_ray_time_arb_n21.json
            for f in \
              evidence/199col_uniform_ray_time_search_n21.json \
              evidence/199col_uniform_ray_time_arb_n21.json; do
              if [ -f "/tmp/eui-199time/$f" ]; then
                cp "/tmp/eui-199time/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 199-column finite uniform-ray pricing evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 199-column finite-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-199col-uniform-ray-time
          path: |
            evidence/199col_uniform_ray_time_search_n21.json
            evidence/199col_uniform_ray_time_arb_n21.json
          if-no-files-found: warn
