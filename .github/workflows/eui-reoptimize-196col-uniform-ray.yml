name: EUI reoptimize and certify 196-column uniform-ray pool

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_196col_uniform_ray_escape.py"
      - "verify_196col_uniform_ray_dual_arb.py"
      - ".github/workflows/eui-reoptimize-196col-uniform-ray.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize-196:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs and compile 196-column tools
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile reoptimize_196col_uniform_ray_escape.py verify_196col_uniform_ray_dual_arb.py
      - name: Re-certify the 193-column parent and explicit path
        run: |
          python verify_193col_uniform_ray_dual_arb.py
          python verify_193col_uniform_ray_time_arb.py
      - name: Re-certify the 194-column parent and explicit path
        run: |
          python verify_194col_uniform_ray_dual_arb.py
          python verify_194col_uniform_ray_time_arb.py
      - name: Re-certify the 195-column parent and explicit path
        run: |
          python verify_195col_uniform_ray_dual_arb.py
          python verify_195col_uniform_ray_time_arb.py
      - name: Remove stale 196-column outputs
        run: |
          rm -f evidence/joint_low_six_eighth_lp_196col_uniform_ray_escape_n21.json
          rm -f evidence/candidate_joint_input_196col_uniform_ray_escape_n21.json
          rm -f evidence/55probe_196col_uniform_ray_escape_dual_certificate_n21.json
      - name: Reoptimize the 2,113-row LP after appending the fourth uniform path
        run: python reoptimize_196col_uniform_ray_escape.py
      - name: Independently certify an above-cap 196-column dual
        run: python verify_196col_uniform_ray_dual_arb.py
      - name: Commit only artifacts generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-196/evidence
          for f in \
            evidence/joint_low_six_eighth_lp_196col_uniform_ray_escape_n21.json \
            evidence/candidate_joint_input_196col_uniform_ray_escape_n21.json \
            evidence/55probe_196col_uniform_ray_escape_dual_certificate_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-196/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/joint_low_six_eighth_lp_196col_uniform_ray_escape_n21.json
            rm -f evidence/candidate_joint_input_196col_uniform_ray_escape_n21.json
            rm -f evidence/55probe_196col_uniform_ray_escape_dual_certificate_n21.json
            for f in \
              evidence/joint_low_six_eighth_lp_196col_uniform_ray_escape_n21.json \
              evidence/candidate_joint_input_196col_uniform_ray_escape_n21.json \
              evidence/55probe_196col_uniform_ray_escape_dual_certificate_n21.json; do
              if [ -f "/tmp/eui-196/$f" ]; then
                cp "/tmp/eui-196/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 196-column uniform-ray minimax evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 196-column LP and Arb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-196col-uniform-ray-minimax
          path: |
            evidence/joint_low_six_eighth_lp_196col_uniform_ray_escape_n21.json
            evidence/candidate_joint_input_196col_uniform_ray_escape_n21.json
            evidence/55probe_196col_uniform_ray_escape_dual_certificate_n21.json
          if-no-files-found: warn
