name: EUI reoptimize after ninth certified continuous escape

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_192col_ninth_continuous_escape.py"
      - "verify_192col_ninth_continuous_escape_dual_arb.py"
      - ".github/workflows/eui-192col-ninth-continuous-escape.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit enumeration
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Re-certify the 191-column parent and all nine continuous escapes
        run: |
          python verify_continuous_path_dual_escape_arb.py
          python verify_184col_continuous_dual_escape_arb.py
          python verify_185col_continuous_dual_escape_arb.py
          python verify_186col_continuous_dual_escape_arb.py
          python verify_187col_continuous_dual_escape_arb.py
          python verify_188col_fifth_continuous_escape_dual_arb.py
          python verify_188col_continuous_dual_escape_arb.py
          python verify_189col_sixth_continuous_escape_dual_arb.py
          python verify_189col_continuous_dual_escape_arb.py
          python verify_190col_seventh_continuous_escape_dual_arb.py
          python verify_190col_continuous_dual_escape_arb.py
          python verify_191col_eighth_continuous_escape_dual_arb.py
          python verify_191col_continuous_dual_escape_arb.py
      - name: Compile the 192-column reoptimizer
        run: python -m py_compile reoptimize_192col_ninth_continuous_escape.py verify_192col_ninth_continuous_escape_dual_arb.py
      - name: Remove stale 192-column outputs
        run: |
          rm -f evidence/joint_low_six_eighth_lp_192col_ninth_continuous_escape_n21.json
          rm -f evidence/candidate_joint_input_192col_ninth_continuous_escape_n21.json
          rm -f evidence/55probe_192col_ninth_continuous_escape_dual_certificate_n21.json
      - name: Reoptimize the 192-column, 2,113-row mixed-order LP
        run: python reoptimize_192col_ninth_continuous_escape.py
      - name: Independently certify the 192-column dual when LP remains above one third
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          path = Path("evidence/joint_low_six_eighth_lp_192col_ninth_continuous_escape_n21.json")
          data = json.loads(path.read_text())
          if data["status"] == "192col_ninth_continuous_escape_lp_above_one_third":
              subprocess.run(["python", "verify_192col_ninth_continuous_escape_dual_arb.py"], check=True)
          elif data["status"] == "192col_ninth_continuous_escape_lp_candidate_below_one_third":
              print("Below-cap primal candidate recorded; exact primal Arb and full-orbit audit are a separate required branch.")
          else:
              raise RuntimeError(f"unexpected 192-column LP status: {data.get('status')}")
          PY
      - name: Commit 192-column LP and exact candidate with race-safe retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-192/evidence
          for f in \
            evidence/joint_low_six_eighth_lp_192col_ninth_continuous_escape_n21.json \
            evidence/candidate_joint_input_192col_ninth_continuous_escape_n21.json \
            evidence/55probe_192col_ninth_continuous_escape_dual_certificate_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-192/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/joint_low_six_eighth_lp_192col_ninth_continuous_escape_n21.json
            rm -f evidence/candidate_joint_input_192col_ninth_continuous_escape_n21.json
            rm -f evidence/55probe_192col_ninth_continuous_escape_dual_certificate_n21.json
            for f in \
              evidence/joint_low_six_eighth_lp_192col_ninth_continuous_escape_n21.json \
              evidence/candidate_joint_input_192col_ninth_continuous_escape_n21.json \
              evidence/55probe_192col_ninth_continuous_escape_dual_certificate_n21.json; do
              if [ -f "/tmp/eui-192/$f" ]; then
                cp "/tmp/eui-192/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 192-column LP after ninth continuous escape"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 192-column discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-192col-ninth-continuous-escape
          path: |
            evidence/joint_low_six_eighth_lp_192col_ninth_continuous_escape_n21.json
            evidence/candidate_joint_input_192col_ninth_continuous_escape_n21.json
            evidence/55probe_192col_ninth_continuous_escape_dual_certificate_n21.json
          if-no-files-found: warn
