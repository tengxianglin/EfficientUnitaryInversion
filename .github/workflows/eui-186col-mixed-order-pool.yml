name: EUI reoptimize the 186-column mixed-order pool

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_186col_mixed_order_pool.py"
      - ".github/workflows/eui-186col-mixed-order-pool.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reoptimize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen seed pool and orbit helpers
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
      - name: Re-certify the exact 185-column mixed-order dual
        run: python verify_185col_mixed_order_dual_arb.py
      - name: Re-price all unused canonical columns and Arb-check the leading escape
        run: python price_unused_canonical_paths_against_185col_mixed_order_dual.py
      - name: Remove stale 186-column discovery outputs
        run: rm -f evidence/joint_low_six_lp_186col_mixed_order_n21.json evidence/candidate_joint_input_186col_mixed_order_n21.json
      - name: Reoptimize the 186-column mixed-order LP
        run: python reoptimize_186col_mixed_order_pool.py
      - name: Commit deterministic pricing and 186-column discovery evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-186
          cp evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json /tmp/eui-186/screen.json
          cp evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json /tmp/eui-186/pricing-arb.json
          cp evidence/joint_low_six_lp_186col_mixed_order_n21.json /tmp/eui-186/lp.json
          if [ -f evidence/candidate_joint_input_186col_mixed_order_n21.json ]; then
            cp evidence/candidate_joint_input_186col_mixed_order_n21.json /tmp/eui-186/candidate.json
          fi
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            cp /tmp/eui-186/screen.json evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json
            cp /tmp/eui-186/pricing-arb.json evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json
            cp /tmp/eui-186/lp.json evidence/joint_low_six_lp_186col_mixed_order_n21.json
            rm -f evidence/candidate_joint_input_186col_mixed_order_n21.json
            if [ -f /tmp/eui-186/candidate.json ]; then
              cp /tmp/eui-186/candidate.json evidence/candidate_joint_input_186col_mixed_order_n21.json
            fi
            git add -A evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json evidence/joint_low_six_lp_186col_mixed_order_n21.json evidence/candidate_joint_input_186col_mixed_order_n21.json
            if ! git diff --cached --quiet; then
              git commit -m "Record the 186-column mixed-order reoptimization"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 186-column discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-186col-mixed-order-reoptimization
          path: |
            evidence/55probe_185col_mixed_order_dual_pricing_screen_n21.json
            evidence/55probe_185col_mixed_order_dual_pricing_arb_n21.json
            evidence/joint_low_six_lp_186col_mixed_order_n21.json
            evidence/candidate_joint_input_186col_mixed_order_n21.json
          if-no-files-found: warn
