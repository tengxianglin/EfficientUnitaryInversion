name: EUI full fourth-orbit diagnostic for the 41-atom n=21 ensemble

on:
  workflow_dispatch:
  push:
    paths:
      - "audit_ising_low_moment_two_fourth_ensemble_fourth_orbits.py"
      - "evidence/ising_low_moment_two_fourth_ensemble_n21.json"
      - "ising_fourth_moments.py"
      - "verify_ising_low_moment_design.py"
      - "verify_ising_minor_obstruction.py"
      - "verify_ising_two_mirror_obstruction.py"
      - ".github/workflows/eui-41atom-fourth-orbit-audit.yml"

permissions:
  contents: write

concurrency:
  group: eui-41atom-fourth-orbit-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned numerical and interval stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Audit all 1,440 fourth-order orbits (floating diagnostic)
        env:
          OPENBLAS_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python audit_ising_low_moment_two_fourth_ensemble_fourth_orbits.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ising_low_moment_two_fourth_fourth_audit_n21.json
          if git diff --cached --quiet; then
            echo "No audit changes."
            exit 0
          fi
          git commit -m "Audit all fourth-order orbits of 41-atom n=21 ensemble"
          git push
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: eui-n21-41atom-full-fourth-orbit-diagnostic
          path: evidence/ising_low_moment_two_fourth_fourth_audit_n21.json
          if-no-files-found: error
