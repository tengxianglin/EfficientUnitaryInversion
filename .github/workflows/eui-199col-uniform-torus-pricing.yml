name: EUI 199-column continuous uniform-torus pricing and Arb verification

on:
  push:
    branches: [main]
    paths:
      - "discover_199col_uniform_torus_pricing.py"
      - "verify_199col_uniform_torus_pricing_arb.py"
      - "verify_199col_uniform_ray_dual_arb.py"
      - ".github/workflows/eui-199col-uniform-torus-pricing.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-199col-uniform-torus-pricing
  cancel-in-progress: true

jobs:
  price-199:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs and compile the pricing tools
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile discover_199col_uniform_torus_pricing.py verify_199col_uniform_torus_pricing_arb.py verify_199col_uniform_ray_dual_arb.py verify_199col_program_mass_tv_bound.py verify_198col_uniform_ray_dual_arb.py verify_198col_uniform_torus_pricing_arb.py verify_198col_uniform_ray_time_arb.py
      - name: Re-certify the exact 198-column parent and its torus/time ancestry
        run: |
          python verify_198col_uniform_ray_dual_arb.py
          python verify_198col_uniform_torus_pricing_arb.py
          python verify_198col_uniform_ray_time_arb.py
      - name: Re-certify all 199 finite-pool dual inequalities
        run: python verify_199col_uniform_ray_dual_arb.py
      - name: Recompute the exact 199-pool program-mass TV corollary\n        run: python verify_199col_program_mass_tv_bound.py\n      - name: Search the 21-dimensional uniform-path torus
        run: python discover_199col_uniform_torus_pricing.py --starts 16 --maxiter 160
      - name: Independently certify the exact-decimal torus candidate with Arb
        run: python verify_199col_uniform_torus_pricing_arb.py
      - name: Commit only the search transcript and independent Arb result generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-199torus/evidence
          for f in evidence/199col_program_mass_tv_bound_n21.json evidence/199col_uniform_torus_search_n21.json evidence/199col_uniform_torus_arb_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-199torus/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/199col_program_mass_tv_bound_n21.json evidence/199col_uniform_torus_search_n21.json evidence/199col_uniform_torus_arb_n21.json
            for f in evidence/199col_uniform_torus_search_n21.json evidence/199col_uniform_torus_arb_n21.json; do
              if [ -f "/tmp/eui-199torus/$f" ]; then
                cp "/tmp/eui-199torus/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 199-column continuous torus pricing evidence"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 199-column torus pricing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-199col-continuous-torus-pricing
          path: |
            evidence/199col_uniform_torus_search_n21.json
            evidence/199col_uniform_torus_arb_n21.json
          if-no-files-found: warn
