name: EUI 202-column mixed-order reoptimization after explicit 201-dual escape

on:
  push:
    branches: [main]
    paths:
      - "reoptimize_202col_uniform_ray_escape.py"
      - ".github/workflows/eui-reoptimize-202col-uniform-ray.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-reoptimize-202col-uniform-ray
  cancel-in-progress: true

jobs:
  reoptimize-202:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Regressions and compile the 202-column reoptimizer
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile reoptimize_202col_uniform_ray_escape.py verify_201col_uniform_ray_dual_arb.py verify_201col_program_mass_tv_bound.py verify_201col_uniform_torus_pricing_arb.py verify_201col_uniform_ray_time_arb.py verify_200col_uniform_ray_dual_arb.py verify_200col_program_mass_tv_bound.py verify_200col_uniform_torus_pricing_arb.py verify_200col_uniform_ray_time_arb.py
      - name: Re-certify the exact 201-column parent and its explicit continuous escape
        run: |
          python verify_201col_uniform_ray_dual_arb.py
          python verify_201col_program_mass_tv_bound.py
          python verify_201col_uniform_torus_pricing_arb.py
          python verify_201col_uniform_ray_time_arb.py
      - name: Remove stale 202-column LP outputs
        run: |
          rm -f evidence/joint_low_six_eighth_lp_202col_uniform_ray_escape_n21.json
          rm -f evidence/candidate_joint_input_202col_uniform_ray_escape_n21.json
      - name: Reoptimize the fixed 2,113-row mixed-order LP on 202 physical columns
        run: python reoptimize_202col_uniform_ray_escape.py
      - name: Commit only the 202-column outputs generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-202/evidence
          for f in \
            evidence/joint_low_six_eighth_lp_202col_uniform_ray_escape_n21.json \
            evidence/candidate_joint_input_202col_uniform_ray_escape_n21.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/eui-202/evidence/; fi
          done
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/joint_low_six_eighth_lp_202col_uniform_ray_escape_n21.json
            rm -f evidence/candidate_joint_input_202col_uniform_ray_escape_n21.json
            for f in \
              evidence/joint_low_six_eighth_lp_202col_uniform_ray_escape_n21.json \
              evidence/candidate_joint_input_202col_uniform_ray_escape_n21.json; do
              if [ -f "/tmp/eui-202/$f" ]; then
                cp "/tmp/eui-202/$f" "$f"
                git add "$f"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record 202-column mixed-order reoptimization"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 202-column LP diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-202col-mixed-order-reoptimization
          path: |
            evidence/joint_low_six_eighth_lp_202col_uniform_ray_escape_n21.json
            evidence/candidate_joint_input_202col_uniform_ray_escape_n21.json
          if-no-files-found: warn
