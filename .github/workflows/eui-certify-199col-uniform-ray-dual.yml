name: EUI 199-column mixed-order rational dual Arb certification

on:
  push:
    branches: [main]
    paths:
      - "verify_199col_uniform_ray_dual_arb.py"
      - ".github/workflows/eui-certify-199col-uniform-ray-dual.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eui-certify-199col-uniform-ray-dual
  cancel-in-progress: true

jobs:
  certify-199:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical and interval stack
        run: python -m pip install "numpy==2.3.5" "scipy==1.15.3" "python-flint==0.8.0"
      - name: Verify frozen inputs and compile the 199-column verifier
        run: |
          python freeze_seed_pool.py
          python -m unittest tests/test_eighth_orbit_enumeration.py
          python -m unittest tests/test_uniform_path_torus_basis.py
          python -m py_compile verify_199col_uniform_ray_dual_arb.py verify_198col_uniform_ray_dual_arb.py verify_198col_uniform_torus_pricing_arb.py verify_198col_uniform_ray_time_arb.py
      - name: Re-certify the exact 198-column parent and explicit finite-time escape
        run: |
          python verify_198col_uniform_ray_dual_arb.py
          python verify_198col_uniform_torus_pricing_arb.py
          python verify_198col_uniform_ray_time_arb.py
      - name: Independently rationalize and Arb-certify all 199 dual inequalities
        run: python verify_199col_uniform_ray_dual_arb.py
      - name: Commit only the 199-column rational dual certificate generated by this run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          mkdir -p /tmp/eui-199dual/evidence
          f=evidence/55probe_199col_uniform_ray_escape_dual_certificate_n21.json
          if [ -f "$f" ]; then cp "$f" /tmp/eui-199dual/evidence/; fi
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            rm -f evidence/55probe_199col_uniform_ray_escape_dual_certificate_n21.json
            if [ -f /tmp/eui-199dual/$f ]; then
              cp /tmp/eui-199dual/$f "$f"
              git add "$f"
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Record 199-column mixed-order Arb dual certificate"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Upload 199-column rational dual certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-199col-mixed-order-dual-certificate
          path: evidence/55probe_199col_uniform_ray_escape_dual_certificate_n21.json
          if-no-files-found: warn
